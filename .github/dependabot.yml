version: 2

# One weekly version-update PR across all configured ecosystems.
# Security updates have a separate Dependabot limit.
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

updates:
  # Python - Control Plane API
  - package-ecosystem: "pip"
    directory: "/control-plane-api"
    schedule:
      interval: "weekly"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Router introspection changed; migrate the ordering regressions separately.
      - dependency-name: "fastapi"
        versions: ["0.162.0"]

  # NPM - Portal, Control Plane UI and E2E Tests
  - package-ecosystem: "npm"
    directories:
      - "/portal"
      - "/control-plane-ui"
      - "/e2e"
    schedule:
      interval: "weekly"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # ESM-only release requires ESLint 9+; both apps still use ESLint 8.
      - dependency-name: "eslint-plugin-react-refresh"
        versions: ["0.5.7"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Cargo - STOA Gateway
  - package-ecosystem: "cargo"
    directory: "/stoa-gateway"
    schedule:
      interval: "weekly"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pingora 0.8.1 still constructs a zero-capacity Tokio buffer.
      - dependency-name: "tokio"
        versions: ["1.54.1"]

  # Docker - application build contexts (there is no root Dockerfile)
  - package-ecosystem: "docker"
    directories:
      - "/control-plane-api"
      - "/control-plane-ui"
      - "/portal"
      - "/stoa-gateway"
      - "/stoa-go"
    schedule:
      interval: "weekly"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The 3.13 image introduces HIGH findings in bundled Python tooling.
      - dependency-name: "python"
        versions: ["3.13-slim"]
