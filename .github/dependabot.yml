version: 2

# One weekly version-update PR across all configured ecosystems.
# Security updates have a separate Dependabot limit.
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

updates:
  # Python - Control Plane API
  - package-ecosystem: "pip"
    directory: "/control-plane-api"
    schedule:
      interval: "weekly"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Router introspection changed in 0.137; stay on 0.136.x until migrated.
      # Range filters all >=0.137.0 releases before candidate selection (preventing
      # fallback to older broken 0.137+ releases) while keeping 0.136.x patches eligible.
      - dependency-name: "fastapi"
        versions:
          - ">= 0.137.0"
      # 2.1 honors Enum(create_type=False); stay on 2.0.x until the PostgreSQL fixture is migrated.
      # Range keeps 2.0.x patches eligible while blocking all >=2.1.0 releases.
      - dependency-name: "sqlalchemy"
        versions:
          - ">= 2.1.0"

  # NPM - Portal, Control Plane UI and E2E Tests
  - package-ecosystem: "npm"
    directories:
      - "/portal"
      - "/control-plane-ui"
      - "/e2e"
    schedule:
      interval: "weekly"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # ESM-only 0.5 releases require ESLint 9+; both apps still use ESLint 8.
      # A range, not a list of releases: a list missed 0.5.8 (#3191).
      - dependency-name: "eslint-plugin-react-refresh"
        versions:
          - ">= 0.5.0"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Cargo - STOA Gateway
  - package-ecosystem: "cargo"
    directory: "/stoa-gateway"
    schedule:
      interval: "weekly"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pingora 0.8.1 still constructs a zero-capacity Tokio buffer.
      - dependency-name: "tokio"
        versions:
          - "1.54.0"
          - "1.54.1"

  # Docker - application build contexts (there is no root Dockerfile)
  - package-ecosystem: "docker"
    directories:
      - "/control-plane-api"
      - "/control-plane-ui"
      - "/portal"
      - "/stoa-gateway"
      - "/stoa-go"
    schedule:
      interval: "weekly"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 3.13 introduces HIGH findings; other newer runtimes need separate validation.
      # Keep Python 3.11 until validated; Docker ignores match numeric releases, not tag suffixes.
      - dependency-name: "python"
        versions:
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
