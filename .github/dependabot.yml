version: 2

# One weekly version-update PR across all configured ecosystems.
# Security updates have a separate Dependabot limit.
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

updates:
  # Python - Control Plane API
  - package-ecosystem: "pip"
    directory: "/control-plane-api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # NPM - Portal, Control Plane UI and E2E Tests
  - package-ecosystem: "npm"
    directories:
      - "/portal"
      - "/control-plane-ui"
      - "/e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Cargo - STOA Gateway
  - package-ecosystem: "cargo"
    directory: "/stoa-gateway"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Docker - application build contexts (there is no root Dockerfile)
  - package-ecosystem: "docker"
    directories:
      - "/control-plane-api"
      - "/control-plane-ui"
      - "/portal"
      - "/stoa-gateway"
      - "/stoa-go"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
