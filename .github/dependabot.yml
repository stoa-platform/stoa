version: 2

# One weekly version-update PR across all configured ecosystems.
# Security updates have a separate Dependabot limit.
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

updates:
  # Python - Control Plane API
  - package-ecosystem: "pip"
    directory: "/control-plane-api"
    schedule:
      interval: "weekly"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Router introspection changed in 0.137. Keep safe 0.136.x patches eligible.
      # Exact releases prevent Dependabot falling back to an older broken version.
      - dependency-name: "fastapi"
        versions:
          - "0.137.0"
          - "0.137.1"
          - "0.137.2"
          - "0.138.0"
          - "0.138.1"
          - "0.138.2"
          - "0.139.0"
          - "0.139.1"
          - "0.139.2"
          - "0.140.0"
          - "0.140.1"
          - "0.140.2"
          - "0.140.3"
          - "0.140.4"
          - "0.140.5"
          - "0.140.6"
          - "0.140.7"
          - "0.140.8"
          - "0.140.9"
          - "0.140.10"
          - "0.140.11"
          - "0.140.12"
          - "0.140.13"
          - "0.141.0"
          - "0.141.1"
          - "0.142.0"
          - "0.142.1"
          - "0.142.2"
          - "0.142.3"
          - "0.142.4"
          - "0.143.0"
          - "0.143.1"
          - "0.143.2"
          - "0.143.3"
          - "0.143.4"
          - "0.143.5"
          - "0.144.0"
          - "0.145.0"
          - "0.146.0"
          - "0.147.0"
          - "0.148.0"
          - "0.149.0"
          - "0.150.0"
          - "0.151.0"
          - "0.152.0"
          - "0.153.0"
          - "0.154.0"
          - "0.155.0"
          - "0.156.0"
          - "0.156.1"
          - "0.156.2"
          - "0.156.3"
          - "0.156.4"
          - "0.156.5"
          - "0.156.6"
          - "0.156.7"
          - "0.156.8"
          - "0.157.0"
          - "0.158.0"
          - "0.158.1"
          - "0.158.2"
          - "0.159.0"
          - "0.159.1"
          - "0.160.0"
          - "0.161.0"
          - "0.161.1"
          - "0.162.0"

  # NPM - Portal, Control Plane UI and E2E Tests
  - package-ecosystem: "npm"
    directories:
      - "/portal"
      - "/control-plane-ui"
      - "/e2e"
    schedule:
      interval: "weekly"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # ESM-only 0.5 releases require ESLint 9+; both apps still use ESLint 8.
      - dependency-name: "eslint-plugin-react-refresh"
        versions:
          - "0.5.0"
          - "0.5.1"
          - "0.5.2"
          - "0.5.3"
          - "0.5.4"
          - "0.5.5"
          - "0.5.6"
          - "0.5.7"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Cargo - STOA Gateway
  - package-ecosystem: "cargo"
    directory: "/stoa-gateway"
    schedule:
      interval: "weekly"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pingora 0.8.1 still constructs a zero-capacity Tokio buffer.
      - dependency-name: "tokio"
        versions:
          - "1.54.0"
          - "1.54.1"

  # Docker - application build contexts (there is no root Dockerfile)
  - package-ecosystem: "docker"
    directories:
      - "/control-plane-api"
      - "/control-plane-ui"
      - "/portal"
      - "/stoa-gateway"
      - "/stoa-go"
    schedule:
      interval: "weekly"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 3.13 introduces HIGH findings; other newer runtimes need separate validation.
      # Keep Python 3.11 until validated; Docker ignores match numeric releases, not tag suffixes.
      - dependency-name: "python"
        versions:
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
