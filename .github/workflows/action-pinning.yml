name: Action Pinning Guard

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  merge_group:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install hash-locked YAML parser
        run: python -m pip install --require-hashes -r .github/workflows/requirements/pyyaml.txt
      - name: Test pinning guard
        run: python -B -m unittest discover -s .github/workflows/validation -p 'test_*.py' -v
      - name: Validate all workflow references and automated updates
        run: python -B .github/workflows/validation/check_action_pins.py
