name: Backup Restore CI

# Proves scripts/backup/backup-postgres.sh can back up and restore a database:
# one backup -> damage -> restore cycle against a disposable PostgreSQL
# service container (no cluster, no S3, nothing persisted).

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/backup/**'
      - 'tests/backup/**'
      - '.github/workflows/backup-restore-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/backup/**'
      - 'tests/backup/**'
      - '.github/workflows/backup-restore-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-backup-restore:
    name: PostgreSQL backup/restore cycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
        env:
          POSTGRES_USER: stoa
          POSTGRES_PASSWORD: stoa
          POSTGRES_DB: stoa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stoa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check shell syntax
        run: |
          bash -n scripts/backup/common.sh
          bash -n scripts/backup/backup-postgres.sh
          bash -n tests/backup/test-postgres-backup-restore.sh

      - name: Regression — pg_dump major must match the server
        run: python3 tests/backup/test_regression_cab_2518_pg_dump_matches_server.py

      - name: Install PostgreSQL 16 client tools
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # ubuntu-latest (26.04) ships pg_dump 18 and its archive has no
          # postgresql-client-16 (apt: Unable to locate package). pg_dump 17+
          # writes SET transaction_timeout, which the PostgreSQL 16 service
          # container rejects, so the restore aborts after DROP DATABASE.
          # PGDG publishes the matching 16 client (16.15-1.pgdg26.04). Kubectl
          # mode runs whatever pg_dump/psql name resolves on PATH.
          sudo apt-get update
          if ! apt-cache show postgresql-client-16 >/dev/null 2>&1; then
            . /etc/os-release
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update
          fi
          sudo apt-get install -y postgresql-client-16
          client_dir=/usr/lib/postgresql/16/bin
          if [[ ! -x "${client_dir}/pg_dump" || ! -x "${client_dir}/psql" ]]; then
            echo "postgresql-client-16 did not provide ${client_dir}/{pg_dump,psql}" >&2
            exit 1
          fi
          echo "${client_dir}" >> "$GITHUB_PATH"

      - name: Require PostgreSQL 16 client tools
        run: |
          set -euo pipefail
          psql --version
          pg_dump --version
          version_line=$(pg_dump --version)
          if [[ ! "$version_line" =~ ([0-9]+) ]]; then
            echo "Cannot parse pg_dump version: ${version_line}" >&2
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "16" ]]; then
            echo "pg_dump on PATH must be major 16 (same as the disposable server); got: ${version_line}" >&2
            exit 1
          fi

      - name: Run backup/restore cycle on disposable database
        env:
          BACKUP_RESTORE_TEST_DISPOSABLE: '1'
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: stoa
          # Throwaway credential of the service container above
          PGPASSWORD: stoa
        run: bash tests/backup/test-postgres-backup-restore.sh
