name: DX Benchmark

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual benchmark'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout quickstart benchmark
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: stoa-platform/stoa-quickstart
          path: stoa-quickstart

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Run Benchmark
        id: benchmark
        working-directory: stoa-quickstart
        run: |
          chmod +x benchmark.sh
          set +e
          ./benchmark.sh --ci | tee benchmark-output.txt
          benchmark_status=${PIPESTATUS[0]}
          set -e

          # Extract results for summary
          {
            echo "## DX Benchmark Results"
            echo ""
            cat benchmark-output.txt
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$benchmark_status"

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results-${{ github.sha }}
          path: stoa-quickstart/benchmark-output.txt
          retention-days: 90

      - name: Check Benchmark Status
        if: failure()
        run: |
          echo "::error::Benchmark failed to meet OSS Killer Standard targets"
          exit 1
