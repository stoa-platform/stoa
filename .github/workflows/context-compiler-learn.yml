# Context Compiler — Post-Merge Learning
# Runs after each merge to main. Compares predicted vs actual changes to improve impact DB accuracy.
# DB updates are committed on bot/context-compiler-learn and proposed as a pull request into main.
# The workflow does not push main and does not merge that pull request.
# Kill-switch: set DISABLE_CONTEXT_COMPILER=true in repo variables to disable.

name: Context Compiler — Post-Merge Learning

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/learning/**"
      - "docs/context-packs/**"
      - "*.md"
      # CAB-2301 F4: files written by the bot PRs (this workflow and
      # weekly-impact-review). Merging those PRs must not start a new
      # learning run. Replaces the former skip-ci marker.
      - "docs/stoa-impact.db"
      - "docs/DEPENDENCIES.md"
      - "docs/SCENARIOS.md"
      - ".claude/**"
      - ".github/workflows/context-compiler-*.yml"

concurrency:
  group: context-compiler-learn
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  learn:
    if: vars.DISABLE_CONTEXT_COMPILER != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pr_url: ${{ steps.botpr.outputs.pr_url }}
      branch: ${{ steps.botpr.outputs.branch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so the bot branch can merge main and fast-forward
          # without a force-push. post-change-learn.sh still diffs HEAD~1.
          fetch-depth: 0

      - name: Unlock git-crypt
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          sudo apt-get install -y git-crypt
          printf '%s' "$GIT_CRYPT_KEY" | base64 -d > /tmp/git-crypt.key
          git-crypt unlock /tmp/git-crypt.key
          rm /tmp/git-crypt.key

      - name: Check prerequisites
        id: prereq
        run: |
          if [ ! -f docs/stoa-impact.db ]; then
            echo "::warning::stoa-impact.db not found — skipping post-change learning"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f docs/scripts/post-change-learn.sh ]; then
            echo "::warning::post-change-learn.sh not found — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f docs/file-map.json ]; then
            echo "::warning::file-map.json not found — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Extract ticket ref from commit
        id: ticket
        if: steps.prereq.outputs.skip != 'true'
        run: |
          # Look for CAB-XXXX in commit message or PR title
          TICKET=$(git log --format=%s -1 HEAD | grep -oP 'CAB-\d+' | head -1 || echo "")
          echo "ref=${TICKET}" >> "$GITHUB_OUTPUT"
          echo "Ticket ref: ${TICKET:-none}"

      - name: Run post-change learning
        if: steps.prereq.outputs.skip != 'true'
        continue-on-error: true
        run: |
          chmod +x docs/scripts/post-change-learn.sh
          TICKET_ARG=""
          if [ -n "${{ steps.ticket.outputs.ref }}" ]; then
            TICKET_ARG="--ticket ${{ steps.ticket.outputs.ref }}"
          fi
          docs/scripts/post-change-learn.sh \
            --commit HEAD \
            $TICKET_ARG

      - name: Open pull request with DB updates
        id: botpr
        if: steps.prereq.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TICKET_REF: ${{ steps.ticket.outputs.ref || 'unknown' }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SERVER: ${{ github.server_url }}
        run: |
          git config user.name "STOA AI Factory"
          git config user.email "factory@gostoa.dev"
          cat > /tmp/commit-msg.txt << EOF
          chore: post-change learning for ${TICKET_REF}
          EOF
          cat > /tmp/pr-body.md << EOF
          ## Summary
          Post-merge learning for \`${TICKET_REF}\` at \`${SOURCE_SHA}\`.

          Run: ${SOURCE_SERVER}/${SOURCE_REPO}/actions/runs/${SOURCE_RUN_ID}

          CI opens this pull request and does not merge it.
          Merging it does not start this workflow again: its paths are in \`paths-ignore\`.
          CI runs on this branch through \`workflow_dispatch\` (CAB-2301 F4).
          EOF
          bash .github/scripts/open-or-update-pr.sh \
            --branch bot/context-compiler-learn \
            --path docs/stoa-impact.db \
            --path docs/learning \
            --message-file /tmp/commit-msg.txt \
            --title "chore: post-change learning" \
            --body-file /tmp/pr-body.md

  # CAB-2301 F4 (CAB-2331): dispatch the workflows that carry the 4 required
  # checks on the bot PR branch. A PR opened with GITHUB_TOKEN triggers no
  # pull_request workflow. This job does only that, and holds no other right.
  dispatch-required-checks:
    needs: learn
    if: needs.learn.outputs.branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { actions: write }
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_URL: ${{ needs.learn.outputs.pr_url }}
      PR_BRANCH: ${{ needs.learn.outputs.branch }}
    steps:
      - name: Dispatch required checks on the bot PR
        run: |
          set -uo pipefail
          PR_NUMBER="${PR_URL##*/}"
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Cannot read the PR number from ${PR_URL}"
            exit 1
          fi
          # Fail on any dispatch error, except HTTP 403 (actions: write not
          # granted yet): then warn, and the PR stays blocked by its missing
          # required checks. Once actions: write is granted, no 403 is
          # expected and every failure fails this job.
          dispatch() {
            local out
            if out=$(gh workflow run "$@" 2>&1); then
              echo "$out"
              return 0
            fi
            echo "$out"
            if grep -q "HTTP 403" <<<"$out"; then
              echo "::warning::Dispatch refused (HTTP 403): GITHUB_TOKEN lacks actions: write (CAB-2331). PR #${PR_NUMBER} stays blocked until its 4 required checks are green."
              return 0
            fi
            echo "::error::Dispatch failed: gh workflow run $*"
            return 1
          }
          rc=0
          dispatch required-checks.yml --ref "$PR_BRANCH" || rc=1
          dispatch regression-guard.yml --ref "$PR_BRANCH" -f pr_number="$PR_NUMBER" || rc=1
          exit "$rc"
