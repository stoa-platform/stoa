name: Dependabot Requirements Locks

on:
  pull_request:
    paths:
      - 'control-plane-api/requirements.txt'
      - 'control-plane-api/requirements-lock.in'
      - '.github/workflows/requirements/stoa-bench.in'

permissions:
  contents: read

concurrency:
  group: dependabot-requirements-locks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-locks:
    name: Regenerate requirements locks
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check GitHub App secrets
        id: check-secrets
        env:
          APP_ID: ${{ secrets.STOA_LOCKS_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.STOA_LOCKS_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "${APP_ID}" && -n "${APP_PRIVATE_KEY}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "régénération manuelle : scripts/ci/regenerate-requirements-locks.sh" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create GitHub App token
        id: app-token
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.STOA_LOCKS_APP_ID }}
          private-key: ${{ secrets.STOA_LOCKS_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout PR branch
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install uv
        if: steps.check-secrets.outputs.configured == 'true'
        run: python -m pip install --require-hashes -r .github/workflows/requirements/uv.txt

      - name: Regenerate requirements locks
        if: steps.check-secrets.outputs.configured == 'true'
        run: bash scripts/ci/regenerate-requirements-locks.sh

      - name: Commit and push updated locks
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add control-plane-api/requirements-lock.txt .github/workflows/requirements/stoa-bench.txt
          if git diff --cached --quiet; then
            echo "Requirements locks are already up to date."
            exit 0
          fi
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "chore(deps): regenerate requirements locks"
          git push origin "HEAD:${HEAD_REF}"
