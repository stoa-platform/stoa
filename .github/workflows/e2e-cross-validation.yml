# =============================================================================
# E2E Cross-Validation Tests (Live Services)
# =============================================================================
# Seeds data via API, then verifies it appears in Console + Portal UI.
# Requires live services — runs on self-hosted runner, NOT a PR gate.
# =============================================================================

name: E2E Cross-Validation

# Déclenchement manuel uniquement : aucun runner self-hosted n'est enregistré
# pour ce dépôt. Le cron et le push restaient en file sans jamais démarrer.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-validation:
    name: Cross-Validation (Seeded Data)
    runs-on: self-hosted
    continue-on-error: true # Live infra — not a PR gate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run auth setup
        working-directory: e2e
        env:
          STOA_CONSOLE_URL: ${{ secrets.E2E_CONSOLE_URL }}
          STOA_PORTAL_URL: ${{ secrets.E2E_PORTAL_URL }}
          STOA_API_URL: ${{ secrets.E2E_GATEWAY_URL }}
          KEYCLOAK_URL: ${{ secrets.E2E_KEYCLOAK_URL }}
          PARZIVAL_USER: ${{ secrets.PARZIVAL_USER }}
          PARZIVAL_PASSWORD: ${{ secrets.PARZIVAL_PASSWORD }}
          ANORAK_USER: ${{ secrets.ANORAK_USER }}
          ANORAK_PASSWORD: ${{ secrets.ANORAK_PASSWORD }}
        run: npx playwright test --project=auth-setup

      - name: Run cross-validation tests
        working-directory: e2e
        env:
          STOA_CONSOLE_URL: ${{ secrets.E2E_CONSOLE_URL }}
          STOA_PORTAL_URL: ${{ secrets.E2E_PORTAL_URL }}
          STOA_API_URL: ${{ secrets.E2E_GATEWAY_URL }}
          STOA_AUTH_URL: ${{ secrets.E2E_KEYCLOAK_URL }}
          ANORAK_USER: ${{ secrets.ANORAK_USER }}
          ANORAK_PASSWORD: ${{ secrets.ANORAK_PASSWORD }}
        run: >
          npx playwright test
          --project=cross-validation-console
          --project=cross-validation-portal

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cross-validation-report-${{ github.run_id }}
          path: e2e/reports/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cross-validation-results-${{ github.run_id }}
          path: e2e/test-results/
          retention-days: 7
