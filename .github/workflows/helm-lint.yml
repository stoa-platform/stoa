# =============================================================================
# GitHub Actions: Helm Lint
# =============================================================================
# STOA Platform - CAB-1074
# Validate Helm charts on changes
# =============================================================================

name: Helm Lint

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/helm-lint.yml'

  # PR runs are driven by ci-gate.yml: called via workflow_call.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint Helm Charts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.0

      - name: Lint stoa-platform chart
        run: helm lint charts/stoa-platform

      - name: Template stoa-platform chart (dry-run)
        run: helm template stoa-platform charts/stoa-platform > /dev/null

      - name: Set up Python for tenant claim contracts
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Verify tenant claim in exports and rendered bootstrap
        run: |
          python3 -m pip install --require-hashes -r .github/workflows/requirements/pyyaml.txt
          python3 -B -m unittest discover -s scripts/security -p test_regression_cab_2262_tenant_claim.py -v

      - name: Verify companion colocation and authorization wiring
        run: python3 -B -m unittest discover -s scripts/tests -p test_companion_helm.py -v

      - name: Lint stoa-observability chart
        run: helm lint charts/stoa-observability

      - name: Template stoa-observability chart (dry-run)
        run: helm template stoa-observability charts/stoa-observability > /dev/null

  # Notify stoa-infra when Helm charts change on main
  # Requires STOA_INFRA_DISPATCH_TOKEN secret (PAT with repo scope on PotoMitan/stoa-infra)
  notify-infra:
    name: Notify stoa-infra
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Dispatch to stoa-infra
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.STOA_INFRA_DISPATCH_TOKEN }}
          repository: PotoMitan/stoa-infra
          event-type: helm-chart-updated
          client-payload: '{"source": "stoa", "ref": "${{ github.sha }}"}'
