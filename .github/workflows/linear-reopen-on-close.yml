# When a PR is closed WITHOUT merging, reopen the linked Linear ticket.
# This prevents tickets from staying "Done" when their PR was abandoned.
# Complements linear-close-on-merge.yml (which fires on merged PRs).
# Kill-switch: set DISABLE_LINEAR_REOPEN=true in repo variables.
#
# CAB-2301: every Linear request is built with `jq -n --arg` and GraphQL
# variables; PR metadata only ever enters as data, never as query text.
# The `gh` lookup uses the workflow token and fails the step on error
# instead of pretending there is no merged PR.

name: Linear Reopen on PR Close

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  reopen-linear:
    if: >-
      github.event.pull_request.merged == false
      && vars.DISABLE_LINEAR_REOPEN != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Extract ticket ID from PR title
        id: extract
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          TITLE="$PR_TITLE"
          TICKET_ID=$(echo "$TITLE" | grep -oP 'CAB-\d{2,4}' | head -1)
          if [ -z "$TICKET_ID" ]; then
            echo "No CAB-XXXX found in PR title: $TITLE"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ticket_id=$TICKET_ID" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Found ticket: $TICKET_ID"

      - name: Reopen Linear ticket if falsely Done
        if: steps.extract.outputs.skip != 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TICKET_ID: ${{ steps.extract.outputs.ticket_id }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          CLOSED_BY: ${{ github.event.sender.login }}
        run: |
          if [ -z "$LINEAR_API_KEY" ]; then
            echo "LINEAR_API_KEY not set — skipping"
            exit 0
          fi

          # Every request body is produced by jq: the query text is constant,
          # all values travel in GraphQL variables.
          linear() {
            curl -s -X POST https://api.linear.app/graphql \
              -H "Authorization: $LINEAR_API_KEY" \
              -H "Content-Type: application/json" \
              --data-binary @-
          }

          # Find the issue
          ISSUE_DATA=$(jq -n --arg identifier "$TICKET_ID" '{
              query: "query($identifier: String!) { issues(filter: { identifier: { eq: $identifier } }) { nodes { id state { name type } } } }",
              variables: { identifier: $identifier }
            }' | linear)

          ISSUE_ID=$(echo "$ISSUE_DATA" | jq -r '.data.issues.nodes[0].id // empty')
          CURRENT_TYPE=$(echo "$ISSUE_DATA" | jq -r '.data.issues.nodes[0].state.type // empty')
          CURRENT_NAME=$(echo "$ISSUE_DATA" | jq -r '.data.issues.nodes[0].state.name // empty')

          if [ -z "$ISSUE_ID" ]; then
            echo "$TICKET_ID not found in Linear — skipping"
            exit 0
          fi

          echo "$TICKET_ID is currently: $CURRENT_NAME ($CURRENT_TYPE)"

          # Only reopen if Done — don't touch In Progress, Todo, Blocked, etc.
          if [ "$CURRENT_TYPE" != "completed" ]; then
            echo "$TICKET_ID is not Done — no action needed"
            exit 0
          fi

          # Check if another merged PR already completed this ticket
          # (ticket might have multiple PRs, one merged and one closed).
          # A failing lookup must fail the step: silently assuming "0 merged PRs"
          # would reopen a ticket that is legitimately Done.
          if ! MERGED_PRS=$(gh pr list --repo "$GH_REPO" --state merged --search "$TICKET_ID" --json number --jq 'length'); then
            echo "::error::gh pr list failed for $TICKET_ID — not reopening"
            exit 1
          fi
          case "$MERGED_PRS" in
            ''|*[!0-9]*) echo "::error::unexpected gh output for $TICKET_ID: $MERGED_PRS"; exit 1 ;;
          esac
          if [ "$MERGED_PRS" -gt 0 ]; then
            echo "$TICKET_ID has $MERGED_PRS merged PR(s) — keeping Done status"
            exit 0
          fi

          # Get the "Todo" state ID
          TODO_DATA=$(jq -n --arg identifier "$TICKET_ID" '{
              query: "query($identifier: String!) { workflowStates(filter: { name: { eq: \"Todo\" }, team: { issues: { identifier: { eq: $identifier } } } }) { nodes { id } } }",
              variables: { identifier: $identifier }
            }' | linear)

          TODO_STATE_ID=$(echo "$TODO_DATA" | jq -r '.data.workflowStates.nodes[0].id // empty')

          if [ -z "$TODO_STATE_ID" ]; then
            echo "Could not find Todo state — skipping"
            exit 0
          fi

          # Move to Todo
          RESULT=$(jq -n --arg id "$ISSUE_ID" --arg stateId "$TODO_STATE_ID" '{
              query: "mutation($id: String!, $stateId: String!) { issueUpdate(id: $id, input: { stateId: $stateId }) { success } }",
              variables: { id: $id, stateId: $stateId }
            }' | linear)

          SUCCESS=$(echo "$RESULT" | jq -r '.data.issueUpdate.success // false')

          if [ "$SUCCESS" = "true" ]; then
            echo "Reopened $TICKET_ID (Done -> Todo)"
          else
            echo "Failed to reopen $TICKET_ID"
            echo "$RESULT" | jq .
            exit 0
          fi

          # Add comment — PR title, URL and author are passed as data.
          COMMENT=$(printf '%s\n\n%s\n\n%s' \
            "Reopened: PR #${PR_NUM} ([${PR_TITLE}](${PR_URL})) was closed without merging by @${CLOSED_BY}." \
            "Ticket was marked Done but the work was never merged to main. Moving back to Todo." \
            "*Auto-reopened by linear-reopen-on-close workflow*")
          jq -n --arg id "$ISSUE_ID" --arg body "$COMMENT" '{
              query: "mutation($id: String!, $body: String!) { commentCreate(input: { issueId: $id, body: $body }) { success } }",
              variables: { id: $id, body: $body }
            }' | linear > /dev/null

          echo "Comment added to $TICKET_ID"

      - name: Write step summary
        if: steps.extract.outputs.skip != 'true'
        env:
          TICKET_ID: ${{ steps.extract.outputs.ticket_id }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## PR Closed Without Merge — $TICKET_ID

          PR #$PR_NUM was closed without merging.
          If $TICKET_ID was marked Done, it has been reopened to Todo.
          EOF
