name: MCP SDK smoke (gateway)

# Reference-client smoke tests for stoa-gateway using the official Python
# MCP SDK (Pydantic-backed, same strict validator family as Anthropic's
# Toolbox / claude.ai). Catches schema regressions like CAB-2106
# (Accept), CAB-2109 (public_methods) and CAB-2112 (InitializeResult
# shape) BEFORE they ship to prod.

on:
  pull_request:
    paths:
      - 'stoa-gateway/**'
      - '.github/workflows/mcp-sdk-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'stoa-gateway/**'
      - '.github/workflows/mcp-sdk-smoke.yml'
  schedule:
    # 08:00 UTC daily probe against prod — catches config drift / chart
    # regressions that bypass the repo (e.g. tool registry changes).
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: mcp-sdk-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # ÉPINGLÉ, et non un plancher. `mcp>=1.0.0` prenait la dernière
  # publication à chaque exécution : le SDK est passé en 2.0.0, qui SUPPRIME
  # `streamablehttp_client` et le remplace par `streamable_http_client` — une
  # API différente (plus de `headers` : on lui passe un httpx.AsyncClient
  # construit par l'appelant). Le smoke cassait donc sans qu'aucun commit ne
  # le provoque. Un plancher de version dans une suite de test n'est pas une
  # souplesse, c'est une dépendance non déterministe.
  # 2.0.0 = version courante, vers laquelle le script est désormais PORTÉ
  # (plus de position d'attente sur une 1.x figée). L'épinglage reste : ce
  # qui cassait n'était pas la version mais le PLANCHER, qui laissait entrer
  # une majeure sans qu'aucun commit ne le décide.
  PY_MCP_VERSION: '2.0.0'

jobs:
  pre-merge:
    # PR + main push: build the gateway from HEAD and run the smoke
    # against a locally-started binary. This is the blocking gate.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: Pre-merge (local gateway)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: stoa-gateway
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system deps (rdkafka + python3)
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libsasl2-dev cmake build-essential \
            python3 python3-venv python3-pip

      # `working-directory` est REQUIS par cette action (aucun défaut) et
      # manquait ici : rust-cache lançait donc `cargo metadata` à la racine du
      # dépôt, où il n'y a pas de Cargo.toml, et le job mourait au setup.
      # Ce workflow n'avait donc JAMAIS pu s'exécuter — alors que son en-tête
      # annonce qu'il attrape les régressions de schéma CAB-2106/2109/2112
      # avant la prod. Un garde écrit EN RÉPONSE à des incidents, qui n'a jamais
      # tourné. `defaults.run.working-directory` ne corrige pas le cas : il ne
      # s'applique qu'aux étapes `run:`, jamais aux `uses:`.
      # rust-scheduled-checks.yml, lui, passait bien l'entrée.
      - uses: ./.github/actions/setup-rust-env
        with:
          working-directory: stoa-gateway

      - name: Install MCP Python SDK
        working-directory: .
        run: |
          python3 -m venv .venv-mcp
          .venv-mcp/bin/pip install --quiet "mcp==${PY_MCP_VERSION}" "cryptography>=47.0.0"

      - name: Build gateway binary
        run: cargo build --release

      - name: Run authenticated MCP SDK smoke
        run: ../.venv-mcp/bin/python tests/e2e/local_mcp_sdk_smoke.py

  post-deploy:
    # Daily cron + manual dispatch: probe prod `mcp.gostoa.dev`. Catches
    # config drift that the repo-level gate misses (tool registry, chart
    # defaults changed out-of-band, etc.).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Post-deploy (prod probe)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install python3 + MCP Python SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-pip
          python3 -m venv .venv-mcp
          .venv-mcp/bin/pip install --quiet "mcp==${PY_MCP_VERSION}"

      - name: Run MCP SDK smoke against prod
        env:
          STOA_GATEWAY_URL: https://mcp.gostoa.dev/mcp/sse
          STOA_SMOKE_CALL_TOOL: '0'
        run: .venv-mcp/bin/python stoa-gateway/tests/e2e/mcp_sdk_smoke.py
