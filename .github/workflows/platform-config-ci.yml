# Platform Configuration CI
# Validates platform bootstrap configs (APIs, Applications, Scopes, Policies)
# Triggered on changes to deploy/platform-bootstrap/
# Validation only: this workflow does not sync or deploy the configs anywhere.
# The sync to the stoa-gitops repository was removed (CAB-2607): that repository
# is abandoned and no ArgoCD manifest reads it.
# Note: gitops-templates/ migrated to stoa-infra (CAB-1911)

name: Platform Config CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'deploy/platform-bootstrap/**'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/platform-bootstrap/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      dry_run:
        description: 'Dry run (validate only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ============================================
  # Stage 1: Validate Configuration
  # ============================================
  validate:
    name: Validate Configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --require-hashes -r .github/workflows/requirements/platform.txt

      - name: Lint YAML files
        run: |
          echo "=== Linting platform-bootstrap configs ==="
          yamllint -d relaxed deploy/platform-bootstrap/

          echo "=== Linting webmethods templates ==="
          if [ -d gitops-templates/webmethods/ ]; then
            yamllint -d relaxed gitops-templates/webmethods/
          else
            echo "gitops-templates/webmethods/ not found, skipping"
          fi

      - name: Validate API configurations
        run: |
          python scripts/validate-platform-config.py --dir deploy/platform-bootstrap

      - name: Check for required fields
        run: |
          echo "=== Checking API configs ==="
          for f in deploy/platform-bootstrap/apis/*.yaml; do
            echo "Checking $f..."
            # Check required fields exist
            grep -q "apiVersion:" "$f" || (echo "Missing apiVersion in $f" && exit 1)
            grep -q "metadata:" "$f" || (echo "Missing metadata in $f" && exit 1)
            grep -q "spec:" "$f" || (echo "Missing spec in $f" && exit 1)
          done

          echo "=== Checking Application configs ==="
          for f in deploy/platform-bootstrap/applications/*.yaml; do
            echo "Checking $f..."
            grep -q "oauth2:" "$f" || (echo "Missing oauth2 in $f" && exit 1)
          done

          echo "All configs valid!"

      - name: Variable substitution test
        run: |
          echo "=== Testing variable substitution ==="
          # Ensure all ${VAR} have defaults or are defined
          grep -rh '\${[A-Z_]*}' deploy/platform-bootstrap/ | \
            grep -v '\${[A-Z_]*:' | \
            grep -v '\${[A-Z_]*:-' | \
            sort -u > /tmp/undefined_vars.txt || true  # intentional: grep exit 1 = no matches = success

          if [ -s /tmp/undefined_vars.txt ]; then
            echo "WARNING: Variables without defaults found:"
            cat /tmp/undefined_vars.txt
            echo ""
            echo "These must be defined in _defaults.yaml or environment config"
          fi

  # ============================================
  # Stage 2: Notify
  # ============================================
  notify:
    name: Send Notifications
    needs: validate
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Determine status
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          if [ "$VALIDATE_RESULT" = "success" ]; then
            echo "STATUS=success" >> "$GITHUB_ENV"
            echo "MESSAGE=✅ Platform configs validated successfully" >> "$GITHUB_ENV"
          elif [ "$VALIDATE_RESULT" = "failure" ]; then
            echo "STATUS=failure" >> "$GITHUB_ENV"
            echo "MESSAGE=❌ Config validation failed" >> "$GITHUB_ENV"
          else
            echo "STATUS=warning" >> "$GITHUB_ENV"
            echo "MESSAGE=⚠️ Config validation did not complete (${VALIDATE_RESULT})" >> "$GITHUB_ENV"
          fi

      - name: Send Slack notification
        if: env.STATUS != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -s -X POST "$SLACK_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "{
                \"text\": \"$MESSAGE\",
                \"blocks\": [
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \"*Platform Config CI/CD*\n$MESSAGE\"
                    }
                  },
                  {
                    \"type\": \"context\",
                    \"elements\": [
                      {
                        \"type\": \"mrkdwn\",
                        \"text\": \"Commit: <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${GITHUB_SHA:0:7}> | <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\"
                      }
                    ]
                  }
                ]
              }"
          fi
