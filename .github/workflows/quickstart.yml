# Fresh runner: timeout 300 on docker compose up --wait, then verify.sh.
# up builds the community gateway when the image is absent.

name: Quickstart

on:
  pull_request:
    paths:
      - "quickstart/**"
      - ".github/workflows/quickstart.yml"
  push:
    branches: [main]
    paths:
      - "quickstart/**"
      - ".github/workflows/quickstart.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: quickstart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  access-control:
    name: Compose access control
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the stack
        working-directory: quickstart
        run: |
          set -euo pipefail
          start=$(date +%s)
          timeout 300 docker compose up --wait
          end=$(date +%s)
          seconds=$((end - start))
          echo "compose_up_seconds=$seconds"
          echo "compose_up_seconds=$seconds" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify 401 then 200
        working-directory: quickstart
        run: ./verify.sh

      - name: Image sizes
        if: always()
        run: |
          docker image ls --digests --format 'table {{.Repository}}\t{{.Tag}}\t{{.Digest}}\t{{.Size}}'

      - name: Logs on failure
        if: failure()
        working-directory: quickstart
        run: docker compose logs --tail=120
