name: Reusable Docker Build (GHCR)

on:
  workflow_call:
    inputs:
      component:
        description: 'Component directory (Docker context)'
        required: true
        type: string
      image-name:
        description: 'GHCR image name (e.g., control-plane-api)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: false
        type: string
        default: 'dev'
      platforms:
        description: 'Docker target platforms'
        required: false
        type: string
        default: 'linux/amd64'
      build-args:
        description: 'Docker build-args (newline-separated KEY=VALUE)'
        required: false
        type: string
        default: ''
      use-monorepo-context:
        description: 'Use repo root as build context (for shared/ dependencies)'
        required: false
        type: boolean
        default: false
    outputs:
      image-tag:
        description: 'Full image tag (registry/repo:env-sha)'
        value: ${{ jobs.docker.outputs.image_tag }}
      image-digest:
        description: 'Image digest'
        value: ${{ jobs.docker.outputs.image_digest }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/stoa-platform/${{ inputs.image-name }}

jobs:
  docker:
    name: Build Docker Image (${{ inputs.component }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_tag: ${{ env.IMAGE_NAME }}:${{ inputs.environment }}-${{ github.sha }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        if: contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # Publish only immutable environment/full-commit tags.
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.environment }}-${{ github.sha }}

      - name: Stage project license and notice
        env:
          COMPONENT: ${{ inputs.component }}
        run: python3 -B scripts/ci/release_legal.py --dest "$COMPONENT"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.use-monorepo-context && '.' || inputs.component }}
          file: ${{ format('{0}/Dockerfile', inputs.component) }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}
          build-args: |
            ${{ inputs.build-args }}
            CACHEBUST=${{ github.sha }}

      - name: Generate SLSA provenance (attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Job Summary
        run: |
          echo "### ${{ inputs.component }} Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE_NAME }}:${{ inputs.environment }}-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** ${{ inputs.platforms }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**SLSA Provenance:** :white_check_mark: Attested" >> $GITHUB_STEP_SUMMARY
