# =============================================================================
# Reusable GitOps Deploy — Dispatch image update to stoa-infra
# =============================================================================
# Replaces direct kubectl deployments. Instead of mutating cluster state,
# this workflow dispatches an image-updated event to stoa-infra, which updates
# Helm chart values. ArgoCD auto-syncs the change to the cluster.
#
# Flow: CI builds image → push to GHCR → dispatch to stoa-infra → ArgoCD syncs
#
# Kill-switch: the deploy job runs only when the repository variable
# GITOPS_DEPLOY_ENABLED is exactly 'true'. Unset or any other value = OFF
# (default): no image-updated dispatch, the job is skipped (not failed).
# Any repository admin/maintainer can set the variable and lift the switch.
# Scope: this stops GitOps writes, prod promotion and smoke-tests.
# reusable-docker-ghcr.yml publishes only immutable <env>-<full SHA> tags
# and attestations, independently of this switch.
#
# Endpoint verify (CAB-2612): an empty URL, or a deadline without HTTP 200,
# is FAIL or SKIP — never a silent success. DEV_POST_DEPLOY_REQUIRED
# (default false) fails the job on that verdict; otherwise the job warns
# and stays green. The image-updated dispatch is unchanged.
#
# Requires: STOA_INFRA_DISPATCH_TOKEN secret (PAT with repo scope on PotoMitan/stoa-infra)
# =============================================================================

name: Reusable GitOps Deploy

on:
  workflow_call:
    inputs:
      component:
        description: 'Component name matching stoa-infra chart (e.g., control-plane-api)'
        required: true
        type: string
      image-tag:
        description: 'Full Docker image tag (e.g., ghcr.io/stoa-platform/control-plane-api:dev-abc123)'
        required: true
        type: string
      environment:
        description: 'Target environment (dev, prod)'
        required: false
        type: string
        default: 'dev'
      environment-url:
        description: 'Environment URL (for GitHub environment link)'
        required: false
        type: string
        default: ''
      verify-endpoint:
        description: 'URL to poll after dispatch (waits for healthy response)'
        required: false
        type: string
        default: ''
      verify-timeout:
        description: 'Seconds to wait for verify-endpoint to be healthy'
        required: false
        type: number
        default: 180
    outputs:
      post_deploy_status:
        description: 'PASS, FAIL, or SKIP for the GitOps endpoint verify'
        value: ${{ jobs.gitops-deploy.outputs.post_deploy_status }}

jobs:
  gitops-deploy:
    if: vars.GITOPS_DEPLOY_ENABLED == 'true'
    name: GitOps Deploy ${{ inputs.component }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      post_deploy_status: ${{ steps.truth.outputs.post_deploy_status }}
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment-url }}

    steps:
      - name: Dispatch image update to stoa-infra
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.STOA_INFRA_DISPATCH_TOKEN }}
          repository: PotoMitan/stoa-infra
          event-type: image-updated
          client-payload: >-
            {
              "component": "${{ inputs.component }}",
              "image_tag": "${{ inputs.image-tag }}",
              "environment": "${{ inputs.environment }}",
              "sha": "${{ github.sha }}",
              "source_repo": "${{ github.repository }}",
              "source_workflow": "${{ github.workflow }}",
              "source_run_id": "${{ github.run_id }}"
            }

      - name: Checkout verify script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: scripts/ci/dev_post_deploy_truth.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Records the poll. The verdict step owns the job result.
      - name: Wait for ArgoCD sync
        id: wait
        env:
          VERIFY_ENDPOINT: ${{ inputs.verify-endpoint }}
          VERIFY_TIMEOUT: ${{ inputs.verify-timeout }}
          VERIFY_COMPONENT: ${{ inputs.component }}
          VERIFY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [ -z "${VERIFY_ENDPOINT}" ]; then
            {
              echo "ran=false"
              echo "ok="
              echo "detail=verify-endpoint empty; GitOps sync was not checked"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Waiting for ArgoCD to sync ${VERIFY_COMPONENT} in ${VERIFY_ENVIRONMENT}..."
          echo "Polling ${VERIFY_ENDPOINT} (timeout: ${VERIFY_TIMEOUT}s)"

          TIMEOUT="${VERIFY_TIMEOUT}"
          INTERVAL=15
          ELAPSED=0
          HTTP_CODE="000"

          # Initial delay for stoa-infra to process dispatch + ArgoCD to detect change
          sleep 30

          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${VERIFY_ENDPOINT}" 2>/dev/null) || HTTP_CODE="000"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Endpoint healthy (HTTP ${HTTP_CODE}) after ${ELAPSED}s"
              {
                echo "ran=true"
                echo "ok=true"
                echo "detail=endpoint healthy"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "  ${ELAPSED}s — HTTP ${HTTP_CODE} (waiting...)"
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "Endpoint not healthy after ${TIMEOUT}s (last: HTTP ${HTTP_CODE})"
          {
            echo "ran=true"
            echo "ok=false"
            echo "detail=Endpoint not healthy after ${TIMEOUT}s (last: HTTP ${HTTP_CODE})"
          } >> "$GITHUB_OUTPUT"

      - name: Record GitOps verify verdict
        id: truth
        if: always() && steps.wait.outcome == 'success'
        env:
          POST_DEPLOY_CONTROL: Wait for ArgoCD sync
          POST_DEPLOY_RAN: ${{ steps.wait.outputs.ran }}
          POST_DEPLOY_OK: ${{ steps.wait.outputs.ok }}
          POST_DEPLOY_REASON: ${{ steps.wait.outputs.detail }}
          POST_DEPLOY_REQUIRED_VAR: ${{ vars.DEV_POST_DEPLOY_REQUIRED }}
          POST_DEPLOY_COMMIT: ${{ github.sha }}
          POST_DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: bash scripts/ci/dev_post_deploy_truth.sh

      - name: Deploy Summary
        if: always()
        env:
          DEPLOY_COMPONENT: ${{ inputs.component }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_IMAGE: ${{ inputs.image-tag }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          {
            echo "### GitOps Deploy: ${DEPLOY_COMPONENT}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Environment | ${DEPLOY_ENVIRONMENT} |"
            echo "| Image | \`${DEPLOY_IMAGE}\` |"
            echo "| Method | GitOps (stoa-infra → ArgoCD) |"
            echo "| SHA | \`${DEPLOY_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
