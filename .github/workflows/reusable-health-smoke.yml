# =============================================================================
# Reusable Health Smoke Test — Tier 1 post-deploy verification
# =============================================================================
# curl-based health checks against 5 endpoints of the target environment.
# Targets (CAB-2362) are resolved by scripts/ci/resolve-smoke-targets.sh for
# the environment that was actually deployed: input `base-domain`, else repo
# variable SMOKE_BASE_DOMAIN_<ENV>, else the derived public prod default.
# Dev has no public default: the smoke is SKIP / NON VÉRIFIÉ, not a pass.
# DEV_POST_DEPLOY_REQUIRED (default false) fails that skip; otherwise the
# job stays green and warns. A probe that ran and saw failures still exits 1.
# Zero auth required, runs in ~30s, catches real deploy failures:
#   pod crash, ingress misconfiguration, Keycloak down, image pull error.
#
# For full E2E with Playwright + personas, see e2e-nightly.yml (Tier 2).
# =============================================================================

name: Reusable Health Smoke Test

on:
  workflow_call:
    inputs:
      component:
        description: 'Component that was just deployed (for logging)'
        required: true
        type: string
      environment:
        description: 'Target environment (dev, prod)'
        required: false
        type: string
        default: 'dev'
      base-domain:
        description: 'Base domain to probe (overrides SMOKE_BASE_DOMAIN_<ENV>)'
        required: false
        type: string
        default: ''
    outputs:
      post_deploy_status:
        description: 'PASS, FAIL, or SKIP for the health smoke'
        value: ${{ jobs.health-check.outputs.post_deploy_status }}
    secrets:
      cf-access-client-id:
        description: 'Cloudflare Access service token id (console is behind Access)'
        required: false
      cf-access-client-secret:
        description: 'Cloudflare Access service token secret'
        required: false

permissions: {}

jobs:
  health-check:
    name: Health Smoke (${{ inputs.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      post_deploy_status: ${{ steps.truth.outputs.post_deploy_status }}
    env:
      SMOKE_ENV: ${{ inputs.environment }}
      SMOKE_COMPONENT: ${{ inputs.component }}
      SMOKE_INPUT_DOMAIN: ${{ inputs.base-domain }}
      SMOKE_PROD_DOMAIN: ${{ vars.SMOKE_BASE_DOMAIN_PROD }}
      SMOKE_VAR_DOMAIN: >-
        ${{ (inputs.environment == 'prod' && vars.SMOKE_BASE_DOMAIN_PROD)
        || (inputs.environment == 'dev' && vars.SMOKE_BASE_DOMAIN_DEV)
        || '' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          sparse-checkout: |
            scripts/ci/resolve-smoke-targets.sh
            scripts/ci/dev_post_deploy_truth.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve smoke targets
        id: resolve
        run: bash scripts/ci/resolve-smoke-targets.sh

      - name: Wait for rollout to converge
        if: steps.resolve.outputs.skip != 'true'
        env:
          SMOKE_DOMAIN: ${{ steps.resolve.outputs.domain }}
        run: |
          set -uo pipefail
          # Poll the just-deployed component's own endpoint until it serves,
          # instead of a fixed sleep — a 2-pod ArgoCD rollout routinely takes
          # longer than 30s and the smoke raced it red on every gateway
          # deploy (CAB-2227).
          case "$SMOKE_COMPONENT" in
            stoa-gateway)          url="https://mcp.${SMOKE_DOMAIN}/health/ready" ;;
            control-plane-api)     url="https://api.${SMOKE_DOMAIN}/health" ;;
            portal|stoa-portal)    url="https://portal.${SMOKE_DOMAIN}" ;;
            control-plane-ui)      url="https://console.${SMOKE_DOMAIN}" ;;
            *)                 url="" ;;
          esac
          if [ -z "$url" ]; then
            echo "No rollout-wait URL for $SMOKE_COMPONENT; sleeping 30s"
            sleep 30
            exit 0
          fi
          echo "Waiting for $url to converge (up to 5 min)..."
          for i in $(seq 1 60); do
            s=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" 2>/dev/null || echo 000)
            if [ "$s" = "200" ]; then
              echo "Ready after ~$((i * 5))s (HTTP $s)"
              exit 0
            fi
            echo "  attempt $i: HTTP $s"
            sleep 5
          done
          # Timed out — let the checks below run and fail with real detail
          # (a component unready after 5 min IS a genuine smoke failure).
          echo "::warning::$url not ready after 5 min — running checks anyway"

      - name: Health checks
        id: checks
        if: steps.resolve.outputs.skip != 'true'
        env:
          SMOKE_DOMAIN: ${{ steps.resolve.outputs.domain }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.cf-access-client-id }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.cf-access-client-secret }}
        run: |
          set -euo pipefail
          PASS=0; FAIL=0

          check() {
            local name="$1" url="$2" expected="${3:-200}" access="${4:-}"
            if [ -n "$access" ]; then
              if [ -z "${CF_ACCESS_CLIENT_ID:-}" ] || [ -z "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
                echo "  $name: missing Cloudflare Access service token secrets"
                FAIL=$((FAIL+1)); return
              fi
              # Headers go through stdin (-H @-) so the token never shows in argv.
              status=$(printf 'CF-Access-Client-Id: %s\nCF-Access-Client-Secret: %s\n' "$CF_ACCESS_CLIENT_ID" "$CF_ACCESS_CLIENT_SECRET" \
                | curl -s -o /dev/null -w "%{http_code}" --max-time 10 --retry 2 --retry-delay 5 -H @- "$url") || status="000"
            else
              status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --retry 2 --retry-delay 5 "$url") || status="000"
            fi
            if [ "$status" = "$expected" ]; then
              echo "  $name: $status"
              PASS=$((PASS+1))
            else
              echo "  $name: $status (expected $expected)"
              FAIL=$((FAIL+1))
            fi
          }

          echo "Health checks for $SMOKE_ENV (after $SMOKE_COMPONENT deploy)"
          echo "---"

          check "API Health"      "https://api.${SMOKE_DOMAIN}/health"
          check "Gateway Health"  "https://mcp.${SMOKE_DOMAIN}/health/ready"
          check "Portal"          "https://portal.${SMOKE_DOMAIN}"
          check "Console"         "https://console.${SMOKE_DOMAIN}" 200 access
          check "Keycloak OIDC"   "https://auth.${SMOKE_DOMAIN}/realms/stoa/.well-known/openid-configuration"

          echo "---"
          echo "Results: $PASS passed, $FAIL failed (component: $SMOKE_COMPONENT)"
          {
            echo "ran=true"
            if [ "$FAIL" -eq 0 ]; then
              echo "ok=true"
              echo "detail=health checks passed"
            else
              echo "ok=false"
              echo "detail=${FAIL} health check(s) failed"
            fi
          } >> "$GITHUB_OUTPUT"
          # Real probe failures stay red. The truth step does not replace this.
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Record health smoke verdict
        id: truth
        if: always() && steps.resolve.outcome == 'success'
        env:
          SMOKE_SKIP: ${{ steps.resolve.outputs.skip }}
          CHECKS_RAN: ${{ steps.checks.outputs.ran }}
          CHECKS_OK: ${{ steps.checks.outputs.ok }}
          CHECKS_DETAIL: ${{ steps.checks.outputs.detail }}
          POST_DEPLOY_CONTROL: Health checks
          POST_DEPLOY_REQUIRED_VAR: ${{ vars.DEV_POST_DEPLOY_REQUIRED }}
          POST_DEPLOY_COMMIT: ${{ github.sha }}
          POST_DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [ "${SMOKE_SKIP:-}" = "true" ]; then
            export POST_DEPLOY_RAN=false
            export POST_DEPLOY_OK=
            export POST_DEPLOY_REASON="SKIPPED, no dev target"
          elif [ "${CHECKS_RAN:-}" != "true" ]; then
            export POST_DEPLOY_RAN=true
            export POST_DEPLOY_OK=false
            export POST_DEPLOY_REASON="${CHECKS_DETAIL:-health checks did not report a result}"
          else
            export POST_DEPLOY_RAN=true
            export POST_DEPLOY_OK="${CHECKS_OK:-false}"
            export POST_DEPLOY_REASON="${CHECKS_DETAIL:-health checks did not report a result}"
          fi
          bash scripts/ci/dev_post_deploy_truth.sh
