# =============================================================================
# Reusable Health Smoke Test — Tier 1 post-deploy verification
# =============================================================================
# curl-based health checks against 5 endpoints of the target environment.
# Targets are configurable (CAB-2362): input `base-domain`, else the repo
# variable SMOKE_BASE_DOMAIN_PROD / SMOKE_BASE_DOMAIN_DEV for `environment`.
# No host is hard-coded; a missing target fails the job explicitly.
# Zero auth required, runs in ~30s, catches real deploy failures:
#   pod crash, ingress misconfiguration, Keycloak down, image pull error.
#
# For full E2E with Playwright + personas, see e2e-nightly.yml (Tier 2).
# =============================================================================

name: Reusable Health Smoke Test

on:
  workflow_call:
    inputs:
      component:
        description: 'Component that was just deployed (for logging)'
        required: true
        type: string
      environment:
        description: 'Target environment (dev, prod)'
        required: false
        type: string
        default: 'dev'
      base-domain:
        description: 'Base domain to probe (overrides SMOKE_BASE_DOMAIN_<ENV>)'
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  health-check:
    name: Health Smoke (${{ inputs.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SMOKE_ENV: ${{ inputs.environment }}
      SMOKE_COMPONENT: ${{ inputs.component }}
      SMOKE_DOMAIN: >-
        ${{ inputs.base-domain != '' && inputs.base-domain
        || (inputs.environment == 'prod' && vars.SMOKE_BASE_DOMAIN_PROD)
        || (inputs.environment == 'dev' && vars.SMOKE_BASE_DOMAIN_DEV)
        || '' }}

    steps:
      - name: Resolve smoke targets
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_DOMAIN// /}" ]; then
            echo "::error::No smoke target for environment '$SMOKE_ENV': set input base-domain or repo variable SMOKE_BASE_DOMAIN_${SMOKE_ENV^^}"
            exit 1
          fi
          echo "Smoke targets: *.$SMOKE_DOMAIN (environment: $SMOKE_ENV)"

      - name: Wait for rollout to converge
        run: |
          set -uo pipefail
          # Poll the just-deployed component's own endpoint until it serves,
          # instead of a fixed sleep — a 2-pod ArgoCD rollout routinely takes
          # longer than 30s and the smoke raced it red on every gateway
          # deploy (CAB-2227).
          case "$SMOKE_COMPONENT" in
            stoa-gateway)          url="https://mcp.${SMOKE_DOMAIN}/health/ready" ;;
            control-plane-api)     url="https://api.${SMOKE_DOMAIN}/health" ;;
            portal|stoa-portal)    url="https://portal.${SMOKE_DOMAIN}" ;;
            control-plane-ui)      url="https://console.${SMOKE_DOMAIN}" ;;
            *)                 url="" ;;
          esac
          if [ -z "$url" ]; then
            echo "No rollout-wait URL for $SMOKE_COMPONENT; sleeping 30s"
            sleep 30
            exit 0
          fi
          echo "Waiting for $url to converge (up to 5 min)..."
          for i in $(seq 1 60); do
            s=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" 2>/dev/null || echo 000)
            if [ "$s" = "200" ]; then
              echo "Ready after ~$((i * 5))s (HTTP $s)"
              exit 0
            fi
            echo "  attempt $i: HTTP $s"
            sleep 5
          done
          # Timed out — let the checks below run and fail with real detail
          # (a component unready after 5 min IS a genuine smoke failure).
          echo "::warning::$url not ready after 5 min — running checks anyway"

      - name: Health checks
        run: |
          set -euo pipefail
          PASS=0; FAIL=0

          check() {
            local name="$1" url="$2" expected="${3:-200}"
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --retry 2 --retry-delay 5 "$url") || status="000"
            if [ "$status" = "$expected" ]; then
              echo "  $name: $status"
              PASS=$((PASS+1))
            else
              echo "  $name: $status (expected $expected)"
              FAIL=$((FAIL+1))
            fi
          }

          echo "Health checks for $SMOKE_ENV (after $SMOKE_COMPONENT deploy)"
          echo "---"

          check "API Health"      "https://api.${SMOKE_DOMAIN}/health"
          check "Gateway Health"  "https://mcp.${SMOKE_DOMAIN}/health/ready"
          check "Portal"          "https://portal.${SMOKE_DOMAIN}"
          check "Console"         "https://console.${SMOKE_DOMAIN}"
          check "Keycloak OIDC"   "https://auth.${SMOKE_DOMAIN}/realms/stoa/.well-known/openid-configuration"

          echo "---"
          echo "Results: $PASS passed, $FAIL failed (component: $SMOKE_COMPONENT)"
          [ "$FAIL" -eq 0 ] || exit 1
