name: Reusable Rust CI

on:
  workflow_call:
    inputs:
      component:
        description: 'Crate directory'
        required: true
        type: string
      cargo-features:
        description: 'Cargo feature flags for clippy/test (default: --all-features)'
        required: false
        type: string
        default: '--all-features'
      runner:
        description: 'Runner label (e.g., ubuntu-latest or self-hosted)'
        required: false
        type: string
        default: 'ubuntu-latest'
      coverage-threshold:
        description: 'Minimum line coverage percentage'
        required: false
        type: number
        default: 60
    outputs:
      test-result:
        description: 'Test result (success/failure)'
        value: ${{ jobs.ci.outputs.result }}
      coverage-pct:
        description: 'Line coverage percentage'
        value: ${{ jobs.ci.outputs.coverage_pct }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Skip coverage steps, not the job: PR/merge queue still report Rust CI success.
  RUN_COVERAGE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' }}

jobs:
  ci:
    # CAB-2355 : sur le runner auto-hébergé (2 slots), tests répartis en 2 parties
    # (nextest --partition). Hébergé : une seule partie (0 = tout), inchangé.
    name: Rust CI${{ matrix.partition > 0 && format(' ({0}/2)', matrix.partition) || '' }}
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON(inputs.runner == 'stoa-rust' && '[1,2]' || '[0]') }}
    env:
      # Couverture : jamais sur la partie 2 (la partie 1 la porte).
      RUN_COVERAGE: ${{ matrix.partition != 2 && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule') }}
    outputs:
      result: ${{ steps.set-result.outputs.result }}
      coverage_pct: ${{ steps.extract-cov.outputs.coverage_pct }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.component }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # CAB-2355 M4 : aucun jeton laissé dans .git sur l'hôte auto-hébergé.
          persist-credentials: false

      - name: Install system dependencies for rdkafka
        # Auto-hébergé (CAB-2355) : dépendances préinstallées, runner sans sudo.
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libsasl2-dev cmake build-essential

      - uses: ./.github/actions/setup-rust-env
        # Hébergé uniquement : rust-cache vide/restaure target/ à chaque run.
        if: runner.environment == 'github-hosted'
        with:
          components: clippy,rustfmt
          working-directory: ${{ inputs.component }}

      # Auto-hébergé (CAB-2355) : toolchain rustup du runner et target/ persistant
      # entre les runs (un répertoire par runner et par composant : un runner
      # n'exécute qu'un job à la fois, donc pas de runs concurrents sur un même
      # répertoire). Purge complète au-delà de 40 Go.
      - name: Persistent toolchain and target dir (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          # Ne dépend pas du .path du runner (régénéré au redémarrage du service).
          export PATH="${HOME}/.cargo/bin:${PATH}"
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
          # CAB-2355 M4 : toolchain épinglée (version exacte en service au 2026-11-02).
          rustup toolchain install 1.99.1 --profile minimal -c clippy,rustfmt --no-self-update
          rustup default 1.99.1
          # CAB-2355 M4 : caches séparés. Une PR n'écrit jamais dans le cache
          # de main / merge_group (et inversement).
          if [ "${{ github.event_name }}" = "pull_request" ]; then K="pr"; else K="trusted"; fi
          echo "CI_CACHE_CLASS=$K" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=${HOME}/.cache/sccache/${K}" >> "$GITHUB_ENV"
          T="${HOME}/.cache/cargo-target/${RUNNER_NAME}/${K}/${{ inputs.component }}"
          mkdir -p "$T"
          if [ "$(du -s --block-size=1G "$T" | cut -f1)" -gt 40 ]; then
            echo "target dir > 40G: cargo clean"
            cargo clean --target-dir "$T"
          fi
          echo "CARGO_TARGET_DIR=$T" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

      # setup-rust-env keys Swatinem/rust-cache on Cargo.lock and the toolchain.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-nextest@0.9.150

      - name: Setup sccache
        id: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: runner.environment == 'github-hosted'
        continue-on-error: true
        env:
          SCCACHE_GHA_ENABLED: 'true'

      - name: Enable sccache wrapper (if available)
        if: steps.sccache.outcome == 'success'
        run: |
          if sccache --start-server 2>/dev/null && sccache --show-stats 2>/dev/null; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "sccache available — compilation cache enabled"
          else
            echo "sccache not functional — proceeding without it"
          fi

      # Auto-hébergé (CAB-2355) : sccache local persistant (SCCACHE_DIR du runner).
      - name: Enable local sccache (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          sccache --stop-server >/dev/null 2>&1 || true  # repartir avec le SCCACHE_DIR de la classe
          if command -v sccache >/dev/null && sccache --start-server 2>/dev/null; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "local sccache enabled"
          else
            echo "sccache not available — proceeding without it"
          fi

      # The gateway permission test runs the production CP router locally.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: inputs.component == 'stoa-gateway'
        with:
          python-version: '3.11'

      - name: Prepare local control-plane test peer
        if: inputs.component == 'stoa-gateway'
        run: |
          # Auto-hébergé (CAB-2355) : venv persistant, clé = hash des requirements
          # + version Python ; construit à côté puis renommé (jamais à moitié).
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            H=$(cat ../control-plane-api/requirements.txt | sha256sum | cut -c1-16)
            PV=$(python -c 'import platform; print(platform.python_version())')
            V="${HOME}/.cache/cp-test-venv/${CI_CACHE_CLASS}/${PV}-${H}"
          else
            V="${RUNNER_TEMP}/cp-test"
          fi
          if [ ! -x "$V/bin/python" ]; then
            mkdir -p "$(dirname "$V")"
            B="${V}.build-${GITHUB_RUN_ID}"
            python -m venv "$B"
            "$B/bin/pip" install -r ../control-plane-api/requirements.txt aiosqlite
            # -T : jamais de déplacement DANS un venv existant. Échec visible.
            if ! mv -T "$B" "$V"; then
              if [ -x "$V/bin/python" ]; then
                echo "::warning::venv ${V} créé entre-temps par un autre run ; copie ${B} supprimée"
                rm -rf "$B"
              else
                echo "::error::impossible d'installer le venv ${V}"
                exit 1
              fi
            fi
          fi
          echo "STOA_CP_TEST_PYTHON=${V}/bin/python" >> "$GITHUB_ENV"

      # --- Step 1: Format check (no compilation, instant) ---
      - name: Check formatting
        id: fmt
        if: matrix.partition != 2
        run: cargo fmt --all -- --check

      # --- Step 2: Clippy (first compilation — cached by sccache across runs) ---
      - name: Clippy lint
        id: clippy
        if: matrix.partition != 2
        run: cargo clippy --all-targets ${{ inputs.cargo-features }} -- -D warnings

      # --- Step 3: Tests (isolated processes, parallel execution) ---
      - name: Run tests
        id: tests
        run: cargo nextest run --locked --no-fail-fast ${{ inputs.cargo-features }} ${{ matrix.partition > 0 && format('--partition count:{0}/2', matrix.partition) || '' }}

      # Nextest does not run doctests; preserve cargo test's existing coverage.
      - name: Run doctests
        id: doctests
        if: matrix.partition != 1
        run: cargo test --locked --doc ${{ inputs.cargo-features }}

      # --- Step 4: Instrumented coverage (main push + nightly only) ---
      # Use a pinned prebuilt tool instead of compiling it on cache misses.
      - name: Install cargo-llvm-cov
        if: env.RUN_COVERAGE == 'true'
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Install llvm-tools-preview
        if: env.RUN_COVERAGE == 'true'
        run: rustup component add llvm-tools-preview

      - name: Run coverage
        if: env.RUN_COVERAGE == 'true'
        env:
          RUSTC_WRAPPER: ''
        shell: bash
        run: |
          cargo llvm-cov nextest --locked --no-fail-fast ${{ inputs.cargo-features }} --json --summary-only --output-path "${RUNNER_TEMP}/cov-summary.json" 2>&1 | tee "${RUNNER_TEMP}/cov-summary.txt"

      - name: Extract coverage percentage
        id: extract-cov
        if: env.RUN_COVERAGE == 'true'
        run: |
          if ! COV_PCT=$(jq -er '.data[0].totals.lines.percent | select(type == "number" and . >= 0 and . <= 100)' "${RUNNER_TEMP}/cov-summary.json") || [ -z "$COV_PCT" ]; then
            echo "::error::Missing or invalid line coverage percentage in LLVM coverage report"
            exit 1
          fi
          echo "coverage_pct=$COV_PCT" >> "$GITHUB_OUTPUT"
          echo "Coverage: $COV_PCT%"

      - name: Enforce coverage threshold
        id: coverage
        if: env.RUN_COVERAGE == 'true'
        run: |
          COV_PCT="${{ steps.extract-cov.outputs.coverage_pct }}"
          THRESHOLD=${{ inputs.coverage-threshold }}
          echo "Coverage: ${COV_PCT}% (threshold: ${THRESHOLD}%)"
          if [ "$(echo "$COV_PCT < $THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COV_PCT}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

      # --- Step 5: sccache stats ---
      - name: Show sccache stats
        if: always() && (steps.sccache.outcome == 'success' || runner.environment == 'self-hosted')
        continue-on-error: true
        run: sccache --show-stats

      # --- Summary ---
      - name: Job Summary
        if: always()
        run: |
          COV_PCT="${{ steps.extract-cov.outputs.coverage_pct }}"
          if [ "$RUN_COVERAGE" = 'true' ]; then
            COV_STATUS="${{ steps.coverage.outcome }} (${COV_PCT:-unavailable}%, threshold: ${{ inputs.coverage-threshold }}%)"
          else
            COV_STATUS="skipped (main push and nightly only)"
          fi
          {
            echo "## ${{ inputs.component }} Rust CI"
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| cargo fmt | ${{ steps.fmt.outcome }} |"
            echo "| cargo clippy | ${{ steps.clippy.outcome }} |"
            echo "| cargo nextest | ${{ steps.tests.outcome }} |"
            echo "| doctests | ${{ steps.doctests.outcome }} |"
            echo "| coverage | ${COV_STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set result output
        id: set-result
        # Matrice : la partie 2 n'écrit qu'en cas d'échec (sinon la partie 1 fait foi).
        if: always() && (matrix.partition != 2 || job.status != 'success')
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        if: always() && env.RUN_COVERAGE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            ${{ runner.temp }}/cov-summary.txt
            ${{ runner.temp }}/cov-summary.json
          retention-days: 30
