# =============================================================================
# Scheduled Rust checks: coverage + cargo audit + bench compile
# Runs daily — instrumented coverage is kept off the PR/merge queue path.
# =============================================================================

name: Rust Scheduled Checks

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Gateway coverage
    uses: ./.github/workflows/reusable-rust-ci.yml
    with:
      component: stoa-gateway
      cargo-features: '--features kafka,pingora,phases'

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stoa-gateway
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Cache cargo-audit binary
        id: cache-audit
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v0.22
      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked
      - run: cargo audit
        continue-on-error: true

  bench-compile:
    name: Compile Benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stoa-gateway
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install system dependencies for rdkafka
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libsasl2-dev cmake
      - uses: ./.github/actions/setup-rust-env
        with:
          working-directory: stoa-gateway
      - name: Compile benchmarks (no-run)
        run: cargo bench --no-run --features kafka,pingora
        continue-on-error: true
