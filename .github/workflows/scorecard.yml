# =============================================================================
# GitHub Actions: OpenSSF Scorecard
# =============================================================================
# Monitors the security posture of the repository.
# Results are uploaded to GitHub Security tab.
# =============================================================================

name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'  # Weekly Monday 5 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    continue-on-error: true  # Private repos lack GraphQL access for Scorecard
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to GitHub Security
        uses: github/codeql-action/upload-sarif@2d3fe93d4896727350828f23e48f5391e6d3f022 # v3
        with:
          sarif_file: results.sarif
