# =============================================================================
# GitHub Actions: Security Scanning — CAB-979 CI Security Showcase
# =============================================================================
# STOA Platform — "Trust the compiler and the CI, not me."
# SAST, dependency audit, secrets, container scan.
# NOTE: The 3 branch-protection required checks (Verify Signed Commits,
# License Compliance, SBOM Generation) have been moved to required-checks.yml
# for faster, more reliable triggering on PRs.
# SLSA & Cosign deferred to CAB-400
# =============================================================================

name: Security Scan

on:
  push:
    branches: [main, develop]
  # PR runs are driven by ci-gate.yml: called via workflow_call.
  workflow_call:
  schedule:
    - cron: '0 6 * * *' # Daily 6:00 AM UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan-changes:
    name: Detect scan contexts
    runs-on: ubuntu-latest
    outputs:
      control-plane-api: ${{ steps.diff.outputs.control-plane-api }}
      portal: ${{ steps.diff.outputs.portal }}
      stoa-gateway: ${{ steps.diff.outputs.stoa-gateway }}
      control-plane-ui: ${{ steps.diff.outputs.control-plane-ui }}
      container-scan: ${{ steps.diff.outputs.container-scan }}
      container-matrix: ${{ steps.diff.outputs.container-matrix }}
      sast-rust: ${{ steps.diff.outputs.sast-rust }}
      sast-python: ${{ steps.diff.outputs.sast-python }}
      sast-javascript: ${{ steps.diff.outputs.sast-javascript }}
      sast-control-plane-ui: ${{ steps.web.outputs.control-plane-ui }}
      sast-portal: ${{ steps.web.outputs.portal }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Select changed scan contexts
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B .github/scripts/security-scan-changes.py

      - name: Filter JavaScript scan components
        if: github.event_name == 'pull_request'
        id: web
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          # Use the checked-out Git history without adding PR API permissions.
          token: ''
          base: ${{ github.event.pull_request.base.sha }}
          predicate-quantifier: every
          filters: ${{ steps.diff.outputs.web-filters }}

      - name: Validate JavaScript filter outputs
        if: github.event_name == 'pull_request'
        env:
          UI_CHANGED: ${{ steps.web.outputs.control-plane-ui }}
          PORTAL_CHANGED: ${{ steps.web.outputs.portal }}
        run: |
          for changed in "$UI_CHANGED" "$PORTAL_CHANGED"; do
            case "$changed" in true|false) ;; *) exit 1 ;; esac
          done

  # ==========================================================================
  # 1. SAST — Rust (Clippy strict)
  # ==========================================================================
  sast-rust:
    name: SAST Rust (Clippy)
    needs: scan-changes
    if: needs.scan-changes.outputs.sast-rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stoa-gateway
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies for rdkafka
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libsasl2-dev cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            stoa-gateway/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('stoa-gateway/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run Clippy
        run: |
          cargo clippy --all-targets --all-features -- \
            -W warnings \
            -D clippy::todo \
            -D clippy::unimplemented \
            -D clippy::dbg_macro \
            -W clippy::unwrap_used \
            -W clippy::expect_used \
            -W clippy::panic

  # ==========================================================================
  # 3. SAST — Python (Bandit)
  # ==========================================================================
  sast-python:
    name: SAST Python (Bandit)
    needs: scan-changes
    if: needs.scan-changes.outputs.sast-python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [control-plane-api]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install --require-hashes -r .github/workflows/requirements/bandit.txt

      - name: Run Bandit
        run: |
          bandit -r ${{ matrix.project }}/ \
            -ll \
            -f json \
            -o bandit-${{ matrix.project }}.json \
            --exit-zero

          # Fail on MEDIUM+ severity and confidence
          bandit -r ${{ matrix.project }}/ --severity-level medium --confidence-level medium

      - name: Upload Bandit results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bandit-${{ matrix.project }}
          path: bandit-${{ matrix.project }}.json
          retention-days: 30

  # ==========================================================================
  # 4. SAST — JavaScript (ESLint Security)
  # ==========================================================================
  sast-javascript:
    name: SAST JavaScript (ESLint)
    needs: scan-changes
    if: needs.scan-changes.outputs.sast-javascript == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [control-plane-ui, portal]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check project has ESLint configured
        # Keep each check name reporting; unchanged PR components pass through.
        # Push, merge-group and nightly events always run both components.
        if: github.event_name != 'pull_request' || needs.scan-changes.outputs[format('sast-{0}', matrix.project)] == 'true'
        id: check
        run: |
          if [ -f "${{ matrix.project }}/package.json" ] && grep -q '"eslint"' "${{ matrix.project }}/package.json"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ESLint config in ${{ matrix.project }}/, skipping"
          fi

      - name: Report unchanged component
        if: github.event_name == 'pull_request' && needs.scan-changes.outputs[format('sast-{0}', matrix.project)] == 'false'
        run: echo 'JavaScript security scan passed through because this component is unchanged.' >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Run ESLint security report (non-blocking)
        if: steps.check.outputs.exists == 'true'
        continue-on-error: true  # Non-blocking: report is collected, blocking gate runs in next step
        working-directory: ${{ matrix.project }}
        run: |
          npx eslint 'src/**/*.{ts,tsx}' \
            --plugin security \
            --rule '{"security/detect-object-injection": "error", "security/detect-non-literal-regexp": "error", "security/detect-unsafe-regex": "error", "security/detect-buffer-noassert": "error", "security/detect-eval-with-expression": "error", "security/detect-no-csrf-before-method-override": "error", "security/detect-possible-timing-attacks": "error"}' \
            --max-warnings 0 \
            --format json --output-file eslint-security.json

      - name: Run ESLint security gate (blocking)
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.project }}
        run: |
          npx eslint 'src/**/*.{ts,tsx}' \
            --no-eslintrc \
            --parser @typescript-eslint/parser \
            --plugin security \
            --rule '{"security/detect-eval-with-expression": "error", "security/detect-unsafe-regex": "error"}' 2>&1 || {
            # Fallback: if --no-eslintrc fails (parser issues), run with project config
            echo "::warning::Falling back to project ESLint config"
            npx eslint 'src/**/*.{ts,tsx}' \
              --plugin security \
              --rule '{"security/detect-eval-with-expression": "error", "security/detect-unsafe-regex": "error"}' \
              --quiet
          }

  # ==========================================================================
  # 5. Dependency Scan (cargo/pip/npm audit)
  # ==========================================================================
  dependency-scan:
    name: Dependency Scan
    needs: scan-changes
    if: needs.scan-changes.outputs.container-scan == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # --- Rust ---
      - name: Install Rust toolchain
        if: ${{ !cancelled() && needs.scan-changes.outputs.stoa-gateway == 'true' }}
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - name: Install cargo-audit
        if: ${{ !cancelled() && needs.scan-changes.outputs.stoa-gateway == 'true' }}
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Cargo audit
        if: ${{ !cancelled() && needs.scan-changes.outputs.stoa-gateway == 'true' }}
        working-directory: stoa-gateway
        run: cargo audit

      # --- Python ---
      - name: Set up Python
        if: ${{ !cancelled() && needs.scan-changes.outputs.control-plane-api == 'true' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install pip-audit
        if: ${{ !cancelled() && needs.scan-changes.outputs.control-plane-api == 'true' }}
        run: pip install --require-hashes -r .github/workflows/requirements/pip-audit.txt

      - name: Pip audit — control-plane-api
        if: ${{ !cancelled() && needs.scan-changes.outputs.control-plane-api == 'true' }}
        run: |
          # CVE-2024-23342: ecdsa Minerva timing attack — transitive dep of python-jose.
          # python-jose[cryptography] uses the 'cryptography' backend for all signing ops;
          # ecdsa is never exercised. Upstream (python-ecdsa) won't fix: side-channel
          # attacks are out of scope for that project. No replacement version available.
          # Audit the hash-locked set the image installs, transitive packages included.
          pip-audit -r control-plane-api/requirements-lock.txt --desc \
            --ignore-vuln CVE-2024-23342

      # --- JavaScript ---
      - name: Set up Node.js
        if: ${{ !cancelled() && (needs.scan-changes.outputs.control-plane-ui == 'true' || needs.scan-changes.outputs.portal == 'true') }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'

      - name: NPM audit — control-plane-ui
        if: ${{ !cancelled() && needs.scan-changes.outputs.control-plane-ui == 'true' }}
        working-directory: control-plane-ui
        # Production dependencies only; development tooling is outside this gate.
        run: npm audit --audit-level=high --omit=dev

      - name: NPM audit — portal
        if: ${{ !cancelled() && needs.scan-changes.outputs.portal == 'true' }}
        working-directory: portal
        run: npm audit --audit-level=high --omit=dev

  # ==========================================================================
  # 6. Secret Scan (Gitleaks)
  # ==========================================================================
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR: scan only the diff (new commits in this PR)
            gitleaks detect --source . --config .gitleaks.toml --verbose --redact \
              --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            # Push/schedule: scan current working tree only (--no-git).
            # Full-history scan finds 500+ false positives from commits pre-OpSec
            # purge (CAB-2057). The allowlist covers current files; old commits
            # with deleted files (ansible/, docs/ibm/) are in the commit blocklist.
            gitleaks detect --source . --config .gitleaks.toml --verbose --redact --no-git
          fi

  # ==========================================================================
  # 6a. Secret Guard (local hook rules on the commit range)
  # ==========================================================================
  # Runs scripts/ci/precommit_secrets.py --range on the commits of the event.
  # The scanner always comes from the protected base revision (pull request
  # base, merge group base, or the revision a branch pointed to before a push),
  # never from the revision under test: it is read as git data from the fetched
  # history into a temporary directory outside the checkout, and no file of the
  # candidate checkout is executed. A base revision that is not in that history,
  # or whose scanner has no range mode, is an error; there is no fallback to
  # the candidate scanner.
  # Events without a commit range (schedule, manual run, branch creation or
  # deletion) skip the checkout and end with an explicit successful no-op.
  secret-guard:
    name: Secret Guard (Hook Rules)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Decided from event fields alone, before any checkout.
      - name: Select commit range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
          PUSH_CREATED: ${{ github.event.created }}
          PUSH_DELETED: ${{ github.event.deleted }}
        run: |
          set -euo pipefail
          full_id='^([0-9a-f]{40}|[0-9a-f]{64})$'
          no_id='^0+$'

          # scan BASE HEAD MODE: a range is selected only between two full commit ids.
          scan() {
            local id
            for id in "$1" "$2"; do
              if [[ ! "$id" =~ $full_id || "$id" =~ $no_id ]]; then
                echo "::error::Secret guard: the event does not provide two full commit ids"
                exit 1
              fi
            done
            printf 'scan=true\nbase=%s\nhead=%s\nmode=%s\n' "$1" "$2" "$3" >> "$GITHUB_OUTPUT"
          }

          skip() {
            echo "$1"
            echo "scan=false" >> "$GITHUB_OUTPUT"
          }

          case "$EVENT_NAME" in
            pull_request)
              scan "$PR_BASE_SHA" "$PR_HEAD_SHA" merge-base
              ;;
            merge_group)
              scan "$MG_BASE_SHA" "$MG_HEAD_SHA" merge-base
              ;;
            push)
              if [[ "$PUSH_DELETED" == "true" || "$PUSH_AFTER_SHA" =~ $no_id ]]; then
                # Branch deletion: the ref has no commit left to scan.
                skip "::notice::Secret guard: branch deletion, no commit to scan"
              elif [[ "$PUSH_CREATED" == "true" || "$PUSH_BEFORE_SHA" =~ $no_id ]]; then
                # Branch creation: there is no prior revision to compare with, and so no
                # protected base revision to take the scanner from. Commits reach a
                # protected branch through pull_request or merge_group runs, which scan
                # their own range, and the Gitleaks job scans the pushed tree.
                skip "::notice::Secret guard: branch creation, no prior revision to compare with"
              else
                # The branch may have moved backwards: compare with the previous revision
                # itself (--direct), and accept a push that adds no commit (--allow-empty).
                scan "$PUSH_BEFORE_SHA" "$PUSH_AFTER_SHA" direct
              fi
              ;;
            schedule|workflow_dispatch)
              skip "Secret guard: this event has no commit range, nothing to scan"
              ;;
            *)
              echo "::error::Secret guard: unsupported event"
              exit 1
              ;;
          esac

      - name: Checkout candidate revision
        if: steps.range.outputs.scan == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Run secret guard on commit range
        if: steps.range.outputs.scan == 'true'
        shell: bash
        # The git commands of this step and of the scanner act on the repository of the
        # current directory.
        working-directory: candidate
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
          SCAN_MODE: ${{ steps.range.outputs.mode }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::Secret guard: $1"
            exit 1
          }

          # The scanner is the blob of the protected base revision, read from the fetched
          # history and written outside the checkout. Git output is never shown.
          git rev-parse --verify --quiet "${BASE_SHA}^{commit}" >/dev/null 2>&1 \
            || fail "the protected base revision does not resolve to a commit"
          scanner_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/secret-guard.XXXXXX" 2>/dev/null)" \
            || fail "unable to create a temporary directory"
          trap 'rm -rf -- "$scanner_dir"' EXIT
          scanner="$scanner_dir/precommit_secrets.py"
          git show "${BASE_SHA}:scripts/ci/precommit_secrets.py" >"$scanner" 2>/dev/null \
            || fail "unable to read the scanner from the protected base revision"
          # No fallback: a base revision without the range mode marker cannot scan this event.
          grep -qxF -- 'RANGE_MODE_SUPPORTED = True' "$scanner" 2>/dev/null \
            || fail "the scanner of the protected base revision has no range mode"

          # Isolated mode (-I) and no bytecode (-B): nothing is loaded from the candidate.
          case "$SCAN_MODE" in
            merge-base)
              python3 -I -B "$scanner" --range "$BASE_SHA" "$HEAD_SHA"
              ;;
            direct)
              python3 -I -B "$scanner" --range "$BASE_SHA" "$HEAD_SHA" --direct --allow-empty
              ;;
            *)
              fail "unknown scan mode"
              ;;
          esac

      # Explicit success keeps "Scan results" green; a missing decision fails closed.
      - name: Confirm there is no commit range to scan
        if: steps.range.outputs.scan != 'true'
        shell: bash
        env:
          SCAN: ${{ steps.range.outputs.scan }}
        run: |
          set -euo pipefail
          if [[ "$SCAN" != "false" ]]; then
            echo "::error::Secret guard: the commit range selection gave no decision"
            exit 1
          fi
          echo "Secret guard: no checkout and no scan for this event"

  # ==========================================================================
  # 6b. OpSec Scan (infrastructure IPs, financial data, client refs)
  # ==========================================================================
  opsec-scan:
    name: OpSec Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run OpSec scanner
        run: |
          chmod +x scripts/opsec-scan.sh
          scripts/opsec-scan.sh --diff origin/main...HEAD

  # ==========================================================================
  # 7. Container Scan (Trivy image)
  # ==========================================================================
  container-scan:
    name: Container Scan
    needs: scan-changes
    if: needs.scan-changes.outputs.container-scan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Rust build (~10 min) + Trivy scan
    permissions:
      contents: read
      security-events: write  # upload-sarif
      actions: read  # upload-sarif reads workflow run metadata
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scan-changes.outputs.container-matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check Dockerfile exists
        id: check
        run: |
          if [ -f "${{ matrix.component.path }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Dockerfile for ${{ matrix.component.name }}"
            exit 1
          fi

      - name: Cache Trivy DB
        if: steps.check.outputs.exists == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-trivy-

      - name: Stage project license and notice
        if: steps.check.outputs.exists == 'true'
        env:
          COMPONENT: ${{ matrix.component.path }}
        run: python3 -B scripts/ci/release_legal.py --dest "$COMPONENT"

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for scanning
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.path }}/Dockerfile
          load: true
          push: false
          tags: stoa/${{ matrix.component.name }}:scan
          # Refresh OS security updates: the stage that installs OS packages is never taken from the cache
          # (a cached "apk upgrade" kept a fixed CVE in the scanned image). Builder stages stay cached.
          no-cache: ${{ matrix.component.name == 'control-plane-api' }}
          no-cache-filters: ${{ contains(fromJSON('["stoa-gateway", "portal", "control-plane-ui"]'), matrix.component.name) && 'runtime' || '' }}
          cache-from: type=gha,scope=security-scan-${{ matrix.component.name }}
          cache-to: type=gha,mode=max,scope=security-scan-${{ matrix.component.name }}

      - name: Run Trivy (SARIF)
        if: steps.check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        env:
          # Never suppress findings through the repository's .trivyignore.
          TRIVY_IGNOREFILE: /dev/null
        with:
          image-ref: 'stoa/${{ matrix.component.name }}:scan'
          format: 'sarif'
          output: 'trivy-${{ matrix.component.name }}.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          ignore-unfixed: false
          exit-code: '0'

      - name: Upload to GitHub Security
        if: steps.check.outputs.exists == 'true'
        continue-on-error: true  # Requires GitHub Advanced Security (private repos)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: 'trivy-${{ matrix.component.name }}.sarif'
          category: 'trivy-${{ matrix.component.name }}'

      # Block fixable HIGH/CRITICAL findings and every CRITICAL finding.
      - name: Run Trivy (fail on fixable HIGH+)
        if: ${{ !cancelled() && steps.check.outputs.exists == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        env:
          TRIVY_IGNOREFILE: /dev/null
        with:
          image-ref: 'stoa/${{ matrix.component.name }}:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          ignore-unfixed: true
          exit-code: '1'

      - name: Run Trivy (fail on any CRITICAL)
        if: ${{ !cancelled() && steps.check.outputs.exists == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        env:
          TRIVY_IGNOREFILE: /dev/null
        with:
          image-ref: 'stoa/${{ matrix.component.name }}:scan'
          format: 'table'
          severity: 'CRITICAL'
          vuln-type: 'os,library'
          ignore-unfixed: false
          exit-code: '1'

  scan-summary:
    name: Scan results
    if: always()
    needs: [scan-changes, secret-guard, dependency-scan, container-scan, sast-rust, sast-python, sast-javascript]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected scans or accept ignored paths
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            .["scan-changes"].result == "success" and
            .["secret-guard"].result == "success" and
            (. as $results | [
              ["dependency-scan", "container-scan"],
              ["container-scan", "container-scan"],
              ["sast-rust", "sast-rust"],
              ["sast-python", "sast-python"],
              ["sast-javascript", "sast-javascript"]
            ] | all(.[];
              $results["scan-changes"].outputs[.[1]] as $run |
              $results[.[0]].result as $result |
              if $run == "true" then $result == "success"
              elif $run == "false" then $result == "skipped"
              else false end))
          '
