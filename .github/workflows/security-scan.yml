# =============================================================================
# GitHub Actions: Security Scanning — CAB-979 CI Security Showcase
# =============================================================================
# STOA Platform — "Trust the compiler and the CI, not me."
# SAST, dependency audit, secrets, container scan.
# NOTE: The 3 branch-protection required checks (Verify Signed Commits,
# License Compliance, SBOM Generation) have been moved to required-checks.yml
# for faster, more reliable triggering on PRs.
# SLSA & Cosign deferred to CAB-400
# =============================================================================

name: Security Scan

on:
  push:
    branches: [main, develop]
  # PR runs are driven by ci-gate.yml: called via workflow_call.
  workflow_call:
  schedule:
    - cron: '0 6 * * *' # Daily 6:00 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan-changes:
    name: Detect scan contexts
    runs-on: ubuntu-latest
    outputs:
      control-plane-api: ${{ steps.diff.outputs.control-plane-api }}
      portal: ${{ steps.diff.outputs.portal }}
      stoa-gateway: ${{ steps.diff.outputs.stoa-gateway }}
      control-plane-ui: ${{ steps.diff.outputs.control-plane-ui }}
      container-scan: ${{ steps.diff.outputs.container-scan }}
      container-matrix: ${{ steps.diff.outputs.container-matrix }}
      sast-rust: ${{ steps.diff.outputs.sast-rust }}
      sast-python: ${{ steps.diff.outputs.sast-python }}
      sast-javascript: ${{ steps.diff.outputs.sast-javascript }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Select changed scan contexts
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B .github/scripts/security-scan-changes.py

  # ==========================================================================
  # 1. SAST — Rust (Clippy strict)
  # ==========================================================================
  sast-rust:
    name: SAST Rust (Clippy)
    needs: scan-changes
    if: needs.scan-changes.outputs.sast-rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stoa-gateway
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies for rdkafka
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libsasl2-dev cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            stoa-gateway/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('stoa-gateway/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run Clippy
        run: |
          cargo clippy --all-targets --all-features -- \
            -W warnings \
            -D clippy::todo \
            -D clippy::unimplemented \
            -D clippy::dbg_macro \
            -W clippy::unwrap_used \
            -W clippy::expect_used \
            -W clippy::panic

  # ==========================================================================
  # 3. SAST — Python (Bandit)
  # ==========================================================================
  sast-python:
    name: SAST Python (Bandit)
    needs: scan-changes
    if: needs.scan-changes.outputs.sast-python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [control-plane-api]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        run: |
          bandit -r ${{ matrix.project }}/ \
            -ll \
            -f json \
            -o bandit-${{ matrix.project }}.json \
            --exit-zero

          # Fail on MEDIUM+ severity and confidence
          bandit -r ${{ matrix.project }}/ --severity-level medium --confidence-level medium

      - name: Upload Bandit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bandit-${{ matrix.project }}
          path: bandit-${{ matrix.project }}.json
          retention-days: 30

  # ==========================================================================
  # 4. SAST — JavaScript (ESLint Security)
  # ==========================================================================
  sast-javascript:
    name: SAST JavaScript (ESLint)
    needs: scan-changes
    if: needs.scan-changes.outputs.sast-javascript == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [control-plane-ui, portal]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check project has ESLint configured
        id: check
        run: |
          if [ -f "${{ matrix.project }}/package.json" ] && grep -q '"eslint"' "${{ matrix.project }}/package.json"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ESLint config in ${{ matrix.project }}/, skipping"
          fi

      - name: Set up Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Install ESLint security plugin
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.project }}
        run: npm install --no-save eslint-plugin-security

      - name: Run ESLint security report (non-blocking)
        if: steps.check.outputs.exists == 'true'
        continue-on-error: true  # Non-blocking: report is collected, blocking gate runs in next step
        working-directory: ${{ matrix.project }}
        run: |
          npx eslint 'src/**/*.{ts,tsx}' \
            --plugin security \
            --rule '{"security/detect-object-injection": "error", "security/detect-non-literal-regexp": "error", "security/detect-unsafe-regex": "error", "security/detect-buffer-noassert": "error", "security/detect-eval-with-expression": "error", "security/detect-no-csrf-before-method-override": "error", "security/detect-possible-timing-attacks": "error"}' \
            --max-warnings 0 \
            --format json --output-file eslint-security.json

      - name: Run ESLint security gate (blocking)
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.project }}
        run: |
          npx eslint 'src/**/*.{ts,tsx}' \
            --no-eslintrc \
            --parser @typescript-eslint/parser \
            --plugin security \
            --rule '{"security/detect-eval-with-expression": "error", "security/detect-unsafe-regex": "error"}' 2>&1 || {
            # Fallback: if --no-eslintrc fails (parser issues), run with project config
            echo "::warning::Falling back to project ESLint config"
            npx eslint 'src/**/*.{ts,tsx}' \
              --plugin security \
              --rule '{"security/detect-eval-with-expression": "error", "security/detect-unsafe-regex": "error"}' \
              --quiet
          }

  # ==========================================================================
  # 5. Dependency Scan (cargo/pip/npm audit)
  # ==========================================================================
  dependency-scan:
    name: Dependency Scan
    needs: scan-changes
    if: needs.scan-changes.outputs.container-scan == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # --- Rust ---
      - name: Install Rust toolchain
        if: needs.scan-changes.outputs.stoa-gateway == 'true'
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - name: Install cargo-audit
        if: needs.scan-changes.outputs.stoa-gateway == 'true'
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Cargo audit
        if: needs.scan-changes.outputs.stoa-gateway == 'true'
        working-directory: stoa-gateway
        continue-on-error: true  # thiserror v1 transitive dep from prometheus — tracked
        run: cargo audit

      # --- Python ---
      - name: Set up Python
        if: needs.scan-changes.outputs.control-plane-api == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install pip-audit
        if: needs.scan-changes.outputs.control-plane-api == 'true'
        run: pip install pip-audit

      - name: Pip audit — control-plane-api
        if: needs.scan-changes.outputs.control-plane-api == 'true'
        continue-on-error: true  # tracked vulns (CVE-2024-23342), not blocking
        run: |
          if [ -f "control-plane-api/requirements.txt" ]; then
            # CVE-2024-23342: ecdsa Minerva timing attack — transitive dep of python-jose.
            # python-jose[cryptography] uses the 'cryptography' backend for all signing ops;
            # ecdsa is never exercised. Upstream (python-ecdsa) won't fix: side-channel
            # attacks are out of scope for that project. No replacement version available.
            pip-audit -r control-plane-api/requirements.txt --desc \
              --ignore-vuln CVE-2024-23342
          fi

      # --- JavaScript ---
      - name: Set up Node.js
        if: needs.scan-changes.outputs.control-plane-ui == 'true' || needs.scan-changes.outputs.portal == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'

      - name: NPM audit — control-plane-ui
        if: needs.scan-changes.outputs.control-plane-ui == 'true'
        continue-on-error: true  # GHSA-3ppc-4f35-3m26 in dev chain, not blocking
        run: |
          if [ -f "control-plane-ui/package-lock.json" ]; then
            # --omit=dev: audit only production dependencies.
            # GHSA-3ppc-4f35-3m26 (minimatch ReDoS) is in @typescript-eslint/eslint-plugin
            # dev-dep chain. Not present in production runtime. Fix requires eslint v10
            # breaking upgrade; deferring until typescript-eslint v8 migration is planned.
            cd control-plane-ui && npm audit --audit-level=high --omit=dev
          fi

      - name: NPM audit — portal
        if: needs.scan-changes.outputs.portal == 'true'
        continue-on-error: true  # audit-level=high, non-blocking
        run: |
          if [ -f "portal/package-lock.json" ]; then
            cd portal && npm audit --audit-level=high --omit=dev
          fi

  # ==========================================================================
  # 6. Secret Scan (Gitleaks)
  # ==========================================================================
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR: scan only the diff (new commits in this PR)
            gitleaks detect --source . --config .gitleaks.toml --verbose --redact \
              --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            # Push/schedule: scan current working tree only (--no-git).
            # Full-history scan finds 500+ false positives from commits pre-OpSec
            # purge (CAB-2057). The allowlist covers current files; old commits
            # with deleted files (ansible/, docs/ibm/) are in the commit blocklist.
            gitleaks detect --source . --config .gitleaks.toml --verbose --redact --no-git
          fi

  # ==========================================================================
  # 6b. OpSec Scan (infrastructure IPs, financial data, client refs)
  # ==========================================================================
  opsec-scan:
    name: OpSec Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run OpSec scanner
        run: |
          chmod +x scripts/opsec-scan.sh
          scripts/opsec-scan.sh --diff origin/main...HEAD

  # ==========================================================================
  # 7. Container Scan (Trivy image)
  # ==========================================================================
  container-scan:
    name: Container Scan
    needs: scan-changes
    if: needs.scan-changes.outputs.container-scan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Rust build (~10 min) + Trivy scan
    continue-on-error: true  # Base image vulns — tracked, not blocking
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scan-changes.outputs.container-matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check Dockerfile exists
        id: check
        run: |
          if [ -f "${{ matrix.component.path }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Dockerfile for ${{ matrix.component.name }}, skipping"
          fi

      - name: Cache Trivy DB
        if: steps.check.outputs.exists == 'true'
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-trivy-

      - name: Stage project license and notice
        if: steps.check.outputs.exists == 'true'
        env:
          COMPONENT: ${{ matrix.component.path }}
        run: python3 -B scripts/ci/release_legal.py --dest "$COMPONENT"

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build image for scanning
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.path }}/Dockerfile
          load: true
          push: false
          tags: stoa/${{ matrix.component.name }}:scan
          # Reuse main's publication layers when the PR scan cache is cold.
          # Keep writes in the scan scope, separate from publication builds.
          cache-from: |
            type=gha,scope=security-scan-${{ matrix.component.name }}
            type=gha,scope=${{ matrix.component.name }}
          cache-to: type=gha,mode=max,scope=security-scan-${{ matrix.component.name }}

      - name: Run Trivy (SARIF)
        if: steps.check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: 'stoa/${{ matrix.component.name }}:scan'
          format: 'sarif'
          output: 'trivy-${{ matrix.component.name }}.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          ignore-unfixed: true

      - name: Upload to GitHub Security
        if: steps.check.outputs.exists == 'true'
        continue-on-error: true  # Requires GitHub Advanced Security (private repos)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: 'trivy-${{ matrix.component.name }}.sarif'
          category: 'trivy-${{ matrix.component.name }}'

      - name: Run Trivy (fail on HIGH+)
        if: steps.check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: 'stoa/${{ matrix.component.name }}:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          ignore-unfixed: true
          exit-code: '1'

  scan-summary:
    name: Scan results
    if: always()
    needs: [scan-changes, dependency-scan, container-scan, sast-rust, sast-python, sast-javascript]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected scans or accept ignored paths
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            .["scan-changes"].result == "success" and
            (. as $results | [
              ["dependency-scan", "container-scan"],
              ["container-scan", "container-scan"],
              ["sast-rust", "sast-rust"],
              ["sast-python", "sast-python"],
              ["sast-javascript", "sast-javascript"]
            ] | all(.[];
              $results["scan-changes"].outputs[.[1]] as $run |
              $results[.[0]].result as $result |
              if $run == "true" then $result == "success"
              elif $run == "false" then $result == "skipped"
              else false end))
          '
