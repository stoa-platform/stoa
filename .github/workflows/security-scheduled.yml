name: Scheduled Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read

jobs:
  advisory-fix-watch:
    name: Advisory Tracking
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    concurrency:
      group: advisory-fix-watch
      cancel-in-progress: false
    steps:
      - name: Record disabled watcher
        if: vars.DISABLE_L2_SCHEDULED == 'true'
        run: echo 'Advisory tracking skipped (DISABLE_L2_SCHEDULED=true).' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: vars.DISABLE_L2_SCHEDULED != 'true'
      - name: Test advisory tracking
        if: vars.DISABLE_L2_SCHEDULED != 'true'
        run: python3 -B -m unittest scripts.ci.tests.test_advisory_fix_watch -v
      - name: Check advisory tracking
        if: vars.DISABLE_L2_SCHEDULED != 'true'
        id: watch
        continue-on-error: true
        run: python3 -B scripts/ci/advisory_fix_watch.py --register scripts/ci/tracked-advisories.json
      - name: Request dependency review
        if: steps.watch.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = 'Advisory tracking: review requested';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Scheduled dependency tracking needs review. See the Advisory Tracking job summary for status and review dates. [View run](${run})`;
            const repo = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...repo, labels: 'dependencies', state: 'open', per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({...repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({...repo, title, body, labels: ['dependencies', 'ci-failure']});
            }

  trivy-images:
    name: Trivy Container Scan (${{ matrix.image_name }})
    if: vars.DISABLE_L2_SCHEDULED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # upload-sarif
    strategy:
      matrix:
        # Anonymous GHCR GETs verified 2026-11-01: header/body SHA-256 and digest GET agree.
        include:
          - image_name: control-plane-api
            image_ref: 'ghcr.io/stoa-platform/control-plane-api@sha256:6100c45b0416dc916d80c145509a1abd007253e6d57239dfbab0e96ea7c840f0'
          - image_name: control-plane-ui
            image_ref: 'ghcr.io/stoa-platform/control-plane-ui@sha256:5ad502335c09dfd75b9a1711fd2e51a4fedbed25de7c451c361b930f822f87b8'
          - image_name: stoa-portal
            image_ref: ''
            unresolved_repository: ghcr.io/stoa-platform/stoa-portal
            # Anonymous GHCR access denied; keep this target pending package/digest proof.
          - image_name: stoa-gateway
            image_ref: 'ghcr.io/stoa-platform/stoa-gateway@sha256:0ea4741d3b83c4de5f5f221a42969e4afbee17ed1d66d40fb92500d77dce991e'
      fail-fast: false
    steps:
      - name: Require verified immutable scan reference
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
          IMAGE_REF: ${{ matrix.image_ref }}
        run: |
          if [[ ! "$IMAGE_REF" =~ ^ghcr\.io/stoa-platform/[a-z0-9._-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::${IMAGE_NAME}: no anonymously verified digest. Preserve this entry until its published image is proven."
            exit 1
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ matrix.image_ref }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Run Trivy (SARIF for GitHub Security)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ matrix.image_ref }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  gitleaks-full:
    name: Gitleaks Full History Scan
    if: vars.DISABLE_L2_SCHEDULED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write  # github-script creates an issue on findings
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --config .gitleaks.toml --verbose
        continue-on-error: true

      - name: Create issue on findings
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = `Gitleaks: Secrets detected in full history scan (${new Date().toISOString().split('T')[0]})`;
            const body = `Weekly Gitleaks full-history scan found potential secrets.\n\nSee workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nLabel: \`security\``;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'ci-failure']
            });

  dependency-audit:
    name: Dependency Audit (All Ecosystems)
    if: vars.DISABLE_L2_SCHEDULED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Python audit
        run: |
          pip install pip-audit
          cd control-plane-api && pip-audit -r requirements.txt --desc 2>&1 || true
        continue-on-error: true

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'

      - name: Node audit
        run: |
          cd control-plane-ui && npm audit --audit-level=high 2>&1 || true
          cd ../portal && npm audit --audit-level=high 2>&1 || true
        continue-on-error: true

      - name: Rust audit
        run: |
          cargo install cargo-audit 2>/dev/null || true
          cd stoa-gateway && cargo audit 2>&1 || true
        continue-on-error: true
