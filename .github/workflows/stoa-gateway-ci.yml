# =============================================================================
# GitHub Actions: STOA Gateway (Rust) CI/CD
# =============================================================================
# Thin orchestrator — delegates to reusable workflows (ADR-031)
# Deployment via GitOps: CI pushes image → dispatches to stoa-infra → ArgoCD syncs
# =============================================================================

name: STOA Gateway CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'stoa-gateway/**'
      - '.github/workflows/stoa-gateway-ci.yml'
      - '.github/workflows/reusable-rust-ci.yml'
      - '.github/workflows/reusable-docker-ghcr.yml'
      - '.github/workflows/reusable-gitops-deploy.yml'
      - '.github/actions/**'

  pull_request:
    branches:
      - main
    paths:
      - 'stoa-gateway/**'
      - '.github/workflows/stoa-gateway-ci.yml'
      - '.github/workflows/reusable-rust-ci.yml'
      - '.github/actions/**'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write
  checks: write
  attestations: write

jobs:
  # === CI: fmt + clippy + test + coverage (single job, sccache) ===
  ci:
    uses: ./.github/workflows/reusable-rust-ci.yml
    with:
      component: stoa-gateway
      cargo-features: '--features kafka,pingora'
      # `ubuntu-latest` : le dépôt n'a AUCUN runner auto-hébergé enregistré
      # (0 au 2026-07-30), donc ce job restait en file indéfiniment — le CI
      # Rust de la gateway ne s'exécutait tout simplement plus.
      # Vérifié avant bascule, car un build Rust peut légitimement dépendre
      # de l'hôte : reusable-rust-ci installe LUI-MÊME ses dépendances
      # système (libcurl, libsasl2, cmake, build-essential) et sccache y est
      # configuré avec SCCACHE_GHA_ENABLED, c'est-à-dire le cache GitHub
      # Actions — conçu pour les runners hébergés, pas un cache disque local.
      # Le workflow a de plus un repli explicite si sccache est indisponible.
      runner: ubuntu-latest
    permissions:
      contents: read

  # === Docker: build + push GHCR (AMD64 only) ===
  # Note: does NOT depend on ci — flaky integration tests must not block deploy.
  # CI still runs in parallel for visibility.
  # ATTENTION — la phrase qui figurait ici (« Clippy/fmt gate PR merges via
  # required checks ») était FAUSSE, vérifié le 2026-07-30. Les checks
  # réellement requis sur `main` sont : License Compliance, SBOM Generation,
  # Verify Signed Commits, Regression Test Guard. Ni clippy, ni fmt, ni aucun
  # CI Rust n'y figure. Ce job ne gardait donc rien — et il ne s'exécutait
  # même pas, faute de runner (corrigé ci-dessus).
  # Une garantie écrite mais inexistante est pire qu'une absence de garantie :
  # elle dispense de vérifier. Corriger la phrase AVANT de décider s'il faut
  # ajouter ce check aux required — c'est une décision de politique de merge,
  # qui appartient aux mainteneurs du dépôt.
  docker:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-docker-ghcr.yml
    with:
      component: stoa-gateway
      image-name: stoa-gateway
      environment: ${{ github.event.inputs.environment || 'dev' }}
      platforms: linux/amd64
      build-args: |
        CACHEBUST=${{ github.sha }}
        FEATURES=kafka,pingora
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    secrets: inherit

  # === GitOps Deploy to Dev: dispatch to stoa-infra → ArgoCD syncs ===
  deploy:
    needs: docker
    if: |
      always() &&
      needs.docker.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/reusable-gitops-deploy.yml
    with:
      component: stoa-gateway
      image-tag: ${{ needs.docker.outputs.image-tag }}
      environment: dev
      environment-url: https://dev-mcp.gostoa.dev
      verify-endpoint: https://dev-mcp.gostoa.dev/health/ready
      verify-timeout: 300
    secrets: inherit

  # === Smoke Test: health checks after deploy (Tier 1) ===
  smoke-test:
    needs: deploy
    if: needs.deploy.result == 'success'
    uses: ./.github/workflows/reusable-health-smoke.yml
    with:
      component: stoa-gateway
      environment: dev
    permissions:
      contents: read

  # === Notify: Slack ===
  notify:
    needs: [ci, docker, deploy, smoke-test]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/reusable-notify.yml
    with:
      component: STOA Gateway
      environment: dev
      ci-result: ${{ needs.ci.outputs.test-result }}
      deploy-result: ${{ needs.deploy.result }}
      smoke-result: ${{ needs.smoke-test.result }}
    secrets: inherit
