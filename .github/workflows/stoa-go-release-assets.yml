# Attach stoactl and stoa-connect release archives plus checksums.txt to an
# already existing GitHub Release for stoa-go-v* tags.
#
# Triggers:
#   1. release (published): runs automatically when a stoa-go-v* release is
#      published; other component releases are skipped.
#   2. workflow_dispatch: accepts a `tag` input (e.g., stoa-go-v0.3.11) to
#      backfill assets on an already published release.
#
# Build and upload strategy:
#   1. build-assets (contents: read) checks out the tag, overlays
#      snapshot.version_template in the working copy when the tagged
#      .goreleaser.yaml does not already honor RELEASE_VERSION, runs GoReleaser
#      in snapshot mode (skipping Docker and Homebrew), verifies the expected
#      archives, and publishes them as a short-lived workflow artifact.
#   2. upload-assets (contents: write) downloads the verified artifact and
#      attaches the files with `gh release upload` (without `--clobber`) so
#      existing release notes, title, and publication state stay intact.
#
# Note:
#   .github/workflows/stoa-go-release.yml is intentionally left untouched and
#   must not be re-enabled while this workflow is active to avoid duplicate
#   asset uploads.

name: stoa-go Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stoa-go release tag (e.g., stoa-go-v0.3.11)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

# Read-only by default; only the upload job requests contents: write.
permissions:
  contents: read

defaults:
  run:
    working-directory: stoa-go

jobs:
  resolve:
    name: Resolve Release Tag
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'stoa-go-v'))
    defaults:
      run:
        working-directory: .
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve and validate release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            echo "::error::Unsupported event: ${EVENT_NAME}" >&2
            exit 1
          fi

          if [[ ! "$TAG" =~ ^stoa-go-v[0-9][0-9A-Za-z.+-]*$ ]] || [[ "$TAG" == *".."* ]]; then
            echo "::error::Invalid stoa-go release tag: ${TAG}" >&2
            exit 1
          fi

          VERSION="${TAG#stoa-go-v}"

          {
            printf 'tag=%s\n' "$TAG"
            printf 'version=%s\n' "$VERSION"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved tag=${TAG} version=${VERSION}"

      - name: Verify GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json tagName,name,isDraft,url

  build-assets:
    name: Build Release Assets
    runs-on: ubuntu-latest
    needs: resolve
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: stoa-go/go.mod
          cache-dependency-path: stoa-go/go.sum

      - name: Ensure snapshot version template honors RELEASE_VERSION
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          cfg = pathlib.Path(".goreleaser.yaml")
          if not cfg.is_file():
              print("::error::Missing stoa-go/.goreleaser.yaml", file=sys.stderr)
              sys.exit(1)

          desired = '{{ with index .Env "RELEASE_VERSION" }}{{ . }}{{ else }}{{ incpatch .Version }}-next{{ end }}'
          lines = cfg.read_text(encoding="utf-8").splitlines(keepends=True)

          in_snapshot = False
          found = False
          updated = False

          for idx, line in enumerate(lines):
              stripped = line.strip()
              if not in_snapshot:
                  if re.match(r"^snapshot:[ \t]*(?:#.*)?$", line):
                      in_snapshot = True
                  continue

              if stripped and not stripped.startswith("#") and not line[0].isspace():
                  break

              match = re.match(r"^([ \t]+)version_template:[ \t]*(.*)$", line)
              if not match:
                  continue

              found = True
              indent, rest = match.groups()
              value = rest.rstrip("\r\n")
              value_no_comment = value.split("#", 1)[0].strip()

              if value_no_comment in ("", "|", ">", "|-", ">-", "|+", ">+"):
                  print(
                      "::error::Unsupported empty or multiline snapshot.version_template in stoa-go/.goreleaser.yaml",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              if "RELEASE_VERSION" in value_no_comment:
                  print("stoa-go/.goreleaser.yaml already honors RELEASE_VERSION in snapshot.version_template; leaving unchanged.")
                  sys.exit(0)

              eol = "\r\n" if line.endswith("\r\n") else "\n"
              lines[idx] = f"{indent}version_template: '{desired}'{eol}"
              updated = True
              break

          if not found or not updated:
              print(
                  "::error::Could not find snapshot.version_template in stoa-go/.goreleaser.yaml",
                  file=sys.stderr,
              )
              sys.exit(1)

          cfg.write_text("".join(lines), encoding="utf-8")
          print("Updated working-copy stoa-go/.goreleaser.yaml snapshot.version_template to honor RELEASE_VERSION.")
          PY

      - name: Build release archives with GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --skip=docker,homebrew
          workdir: stoa-go
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}

      - name: Verify expected release assets
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail

          expected=(
            "dist/stoactl_${RELEASE_VERSION}_linux_amd64.tar.gz"
            "dist/stoactl_${RELEASE_VERSION}_linux_arm64.tar.gz"
            "dist/stoactl_${RELEASE_VERSION}_darwin_amd64.tar.gz"
            "dist/stoactl_${RELEASE_VERSION}_darwin_arm64.tar.gz"
            "dist/stoactl_${RELEASE_VERSION}_windows_amd64.zip"
            "dist/stoactl_${RELEASE_VERSION}_windows_arm64.zip"
            "dist/stoa-connect_${RELEASE_VERSION}_linux_amd64.tar.gz"
            "dist/stoa-connect_${RELEASE_VERSION}_linux_arm64.tar.gz"
            "dist/stoa-connect_${RELEASE_VERSION}_darwin_amd64.tar.gz"
            "dist/stoa-connect_${RELEASE_VERSION}_darwin_arm64.tar.gz"
            "dist/checksums.txt"
          )

          missing=0
          for asset in "${expected[@]}"; do
            if [ ! -s "$asset" ]; then
              echo "::error::Missing or empty expected release asset: ${asset}" >&2
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Contents of dist/:" >&2
            ls -la dist/ >&2 || true
            exit 1
          fi

          echo "Verified ${#expected[@]} expected release assets in dist/."

      - name: Upload verified release assets artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stoa-go-release-assets
          path: |
            stoa-go/dist/stoactl_*.tar.gz
            stoa-go/dist/stoactl_*.zip
            stoa-go/dist/stoa-connect_*.tar.gz
            stoa-go/dist/checksums.txt
          if-no-files-found: error
          retention-days: 1

  upload-assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: [resolve, build-assets]
    permissions:
      contents: write
    steps:
      - name: Download verified release assets artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stoa-go-release-assets
          # upload-artifact stores files relative to their common parent
          # (stoa-go/dist), so extract the basenames into that directory.
          path: stoa-go/dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/stoactl_*.tar.gz dist/stoactl_*.zip dist/stoa-connect_*.tar.gz dist/checksums.txt
