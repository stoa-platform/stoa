name: stoa-go Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: "Release tag (e.g., stoa-go-v0.3.1)"
      version:
        required: true
        type: string
        description: "Semantic version (e.g., 0.3.1)"
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: "Release tag (e.g., stoa-go-v0.3.1)"
      version:
        required: true
        type: string
        description: "Semantic version (e.g., 0.3.1)"

# Read-only by default; the goreleaser job declares what it writes.
permissions:
  contents: read

defaults:
  run:
    working-directory: stoa-go

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write  # GitHub release and assets
      packages: write  # ghcr.io images
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: stoa-go/go.mod
          cache-dependency-path: stoa-go/go.sum

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --skip=docker,homebrew
          workdir: stoa-go
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Attach archives to the existing release
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ inputs.tag }}'}
        run: gh release upload "$RELEASE_TAG" stoa-go/dist/stoactl_*.tar.gz stoa-go/dist/stoactl_*.zip stoa-go/dist/stoa-connect_*.tar.gz stoa-go/dist/checksums.txt
