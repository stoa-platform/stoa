{{- if (default false .Values.externalSecrets.monitoring.prometheusRule.enabled) }}
---
# Alerts on External Secrets Operator sync errors. When the secrets store
# fails, ESO keeps the Kubernetes Secret it last wrote: running pods are not
# affected, but rotations stop reaching the cluster and every new pod starts
# with the last synced value. These alerts make that state visible.
# Requires the ESO controller metrics to be scraped (metrics.service.enabled
# and serviceMonitor.enabled in the external-secrets chart).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-secrets-alerts
  namespace: {{ .Values.externalSecrets.monitoring.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: secrets
    {{- include "stoa-platform.labels" . | nindent 4 }}
    prometheus: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: external-secrets.rules
      rules:
        # Warning: an ExternalSecret reports Ready=False (last sync failed)
        - alert: ExternalSecretNotReady
          expr: max by (namespace, name) (externalsecret_status_condition{condition="Ready", status="False"}) == 1
          for: {{ .Values.externalSecrets.monitoring.prometheusRule.notReadyFor | default "15m" }}
          labels:
            severity: warning
          annotations:
            summary: "ExternalSecret is not synced"
            description: "ExternalSecret {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }} has failed to sync. The Kubernetes Secret keeps its last synced value; rotations are not applied and new pods start with that value."

        # Warning: sync calls keep failing for an ExternalSecret
        - alert: ExternalSecretSyncErrors
          expr: sum by (namespace, name) (increase(externalsecret_sync_calls_error[15m])) > 0
          for: {{ .Values.externalSecrets.monitoring.prometheusRule.syncErrorsFor | default "30m" }}
          labels:
            severity: warning
          annotations:
            summary: "ExternalSecret sync calls are failing"
            description: "ExternalSecret {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }} keeps reporting sync errors. Check the secrets store and the SecretStore credentials."

        # Critical: the store behind ExternalSecrets is not usable
        - alert: SecretStoreNotReady
          expr: |
            max by (namespace, name) (secretstore_status_condition{condition="Ready", status="False"}) == 1
            or
            max by (name) (clustersecretstore_status_condition{condition="Ready", status="False"}) == 1
          for: {{ .Values.externalSecrets.monitoring.prometheusRule.storeNotReadyFor | default "10m" }}
          labels:
            severity: critical
          annotations:
            summary: "SecretStore is not ready"
            description: "SecretStore {{ "{{" }} $labels.name {{ "}}" }} is not ready: no ExternalSecret using it can sync. Existing Secrets keep their last values."
{{- end }}
