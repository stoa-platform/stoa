{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- range $component := list "stoaGateway" "stoaSidecar" }}
{{- $config := index $.Values $component }}
{{- if $config.enabled }}
{{- $gateway := eq $component "stoaGateway" }}
{{- $name := ternary "stoa-gateway" "stoa-sidecar" $gateway }}
{{- $port := 8080 }}
{{- if not $gateway }}
{{- $port = int ($config.mainGateway.port | default 8080) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stoa-platform.fullname" $ }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "stoa-platform.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressNamespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml $np.ingressPodLabels | nindent 14 }}
      ports:
        - {port: {{ $port }}, protocol: TCP}
    {{- if $gateway }}
    {{- if $config.serviceMonitor.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml $np.prometheusPodLabels | nindent 14 }}
      ports:
        - {port: 8080, protocol: TCP}
    {{- end }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: test
              app.kubernetes.io/instance: {{ $.Release.Name }}
      ports:
        - {port: 8080, protocol: TCP}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.controlPlaneNamespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml $np.controlPlanePodLabels | nindent 14 }}
      ports:
        - {port: {{ $np.controlPlanePort }}, protocol: TCP}
    {{- if $config.otelEndpoint }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml $np.otelPodLabels | nindent 14 }}
      ports:
        - {port: {{ $np.otelPort }}, protocol: TCP}
    {{- end }}
    {{- with index $np (ternary "gatewayEgress" "sidecarEgress" $gateway) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
