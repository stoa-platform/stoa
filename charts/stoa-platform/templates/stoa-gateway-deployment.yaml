{{- if .Values.stoaGateway.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stoa-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: stoa-gateway
    app.kubernetes.io/component: gateway
    {{- include "stoa-platform.labels" . | nindent 4 }}
spec:
  {{- if not (and .Values.autoscaling .Values.autoscaling.enabled) }}
  replicas: {{ .Values.stoaGateway.replicas | default 2 }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: stoa-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stoa-gateway
        app.kubernetes.io/component: gateway
        {{- include "stoa-platform.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      {{- if and .Values.stoaGateway.k8s .Values.stoaGateway.k8s.enabled }}
      serviceAccountName: stoa-gateway
      {{- else }}
      serviceAccountName: {{ .Values.stoaGateway.serviceAccount | default "default" }}
      {{- end }}
      {{- if and .Values.infisical .Values.infisical.enabled }}
      initContainers:
        {{- include "stoa-platform.infisical-init-container" (dict "Values" .Values "secretPath" (.Values.infisical.defaultSecretPath | default "/")) | nindent 8 }}
      {{- end }}
      containers:
        - name: stoa-gateway
          {{- include "stoa-platform.pinnedImage" .Values.stoaGateway.image | nindent 10 }}
          imagePullPolicy: {{ .Values.stoaGateway.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: STOA_PORT
              value: "8080"
            - name: STOA_HOST
              value: "0.0.0.0"
            - name: STOA_CONTROL_PLANE_URL
              value: {{ .Values.stoaGateway.controlPlaneUrl | default "http://stoa-control-plane-api.stoa-system.svc.cluster.local:8000" | quote }}
            {{- with .Values.stoaGateway.policyBootTenants }}
            - name: STOA_POLICY_BOOT_TENANTS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: STOA_ROUTE_RELOAD_ENABLED
              value: {{ .Values.stoaGateway.routing.reloadEnabled | quote }}
            - name: STOA_ROUTE_RELOAD_INTERVAL_SECS
              value: {{ .Values.stoaGateway.routing.reloadIntervalSecs | quote }}
            - name: STOA_FEDERATION_ENABLED
              value: {{ .Values.stoaGateway.federation.enabled | quote }}
            - name: STOA_FEDERATION_CACHE_TTL_SECS
              value: {{ .Values.stoaGateway.federation.cacheTtlSecs | quote }}
            - name: STOA_FEDERATION_CACHE_MAX_ENTRIES
              value: {{ .Values.stoaGateway.federation.cacheMaxEntries | quote }}
            {{- $upstreams := .Values.stoaGateway.federation.upstreamsSecretRef }}
            {{- if or .Values.stoaGateway.federation.enabled $upstreams }}
            - name: STOA_FEDERATION_UPSTREAMS
              valueFrom:
                secretKeyRef:
                  name: {{ required "federation.upstreamsSecretRef.name is required" $upstreams.name | quote }}
                  key: {{ required "federation.upstreamsSecretRef.key is required" $upstreams.key | quote }}
            {{- end }}
            - name: STOA_API_PROXY__ENABLED
              value: {{ .Values.stoaGateway.apiProxy.enabled | quote }}
            - name: STOA_API_PROXY__REQUIRE_AUTH
              value: {{ .Values.stoaGateway.apiProxy.requireAuth | quote }}
            {{- range $backend, $fields := .Values.stoaGateway.apiProxy.backends }}
            {{- if not (regexMatch "^[a-z][a-z0-9]*(_[a-z0-9]+)*$" $backend) }}
            {{- fail "apiProxy backend names must be lowercase identifiers" }}
            {{- end }}
            {{- range $field, $value := $fields }}
            {{- if not (has $field (list "enabled" "base_url" "auth_type" "auth_header" "rate_limit_rpm" "timeout_secs" "circuit_breaker_enabled" "fallback_direct" "required_scopes" "required_roles" "public" "allowed_paths")) }}
            {{- fail "apiProxy backend contains an unsupported field; credentials must use the existing credential store" }}
            {{- end }}
            - name: {{ printf "STOA_API_PROXY__BACKENDS__%s__%s" ($backend | upper) ($field | upper) }}
              {{- if kindIs "slice" $value }}
              value: {{ $value | toJson | quote }}
              {{- else }}
              value: {{ $value | quote }}
              {{- end }}
            {{- end }}
            {{- end }}
            - name: STOA_KEYCLOAK_URL
              value: {{ .Values.stoaGateway.keycloakUrl | default "" | quote }}
            - name: STOA_KEYCLOAK_REALM
              value: {{ .Values.stoaGateway.keycloakRealm | default (include "stoa-platform.keycloakRealm" .) | quote }}
            - name: STOA_KEYCLOAK_CLIENT_ID
              value: {{ .Values.stoaGateway.keycloakClientId | default "stoa-mcp-gateway" | quote }}
            - name: STOA_LOG_LEVEL
              value: {{ .Values.stoaGateway.logLevel | default "info" | quote }}
            - name: STOA_LOG_FORMAT
              value: {{ .Values.stoaGateway.logFormat | default "json" | quote }}
            - name: STOA_GATEWAY_MODE
              value: {{ .Values.stoaGateway.mode | default "edge-mcp" | quote }}
            {{- if and .Values.stoaGateway.policies .Values.stoaGateway.policies.enabled }}
            - name: STOA_POLICY_ENABLED
              value: "true"
            - name: STOA_POLICY_PATH
              value: {{ .Values.stoaGateway.policies.path | default "/etc/stoa/policies/default.rego" | quote }}
            {{- end }}
            {{- if and .Values.stoaGateway.k8s .Values.stoaGateway.k8s.enabled }}
            - name: STOA_K8S_ENABLED
              value: "true"
            {{- end }}
            - name: STOA_AUTO_REGISTER
              value: {{ .Values.stoaGateway.autoRegister | default true | quote }}
            - name: STOA_ENVIRONMENT
              value: {{ include "stoa-platform.environment" (dict "root" $ "value" .Values.stoaGateway.environment) | quote }}
            {{- if and .Values.stoaGateway.kafka .Values.stoaGateway.kafka.enabled }}
            - name: STOA_KAFKA_ENABLED
              value: "true"
            - name: STOA_KAFKA_BROKERS
              value: {{ .Values.stoaGateway.kafka.brokers | quote }}
            {{- if .Values.stoaGateway.kafka.meteringTopic }}
            - name: STOA_KAFKA_METERING_TOPIC
              value: {{ .Values.stoaGateway.kafka.meteringTopic | quote }}
            {{- end }}
            {{- if .Values.stoaGateway.kafka.errorsTopic }}
            - name: STOA_KAFKA_ERRORS_TOPIC
              value: {{ .Values.stoaGateway.kafka.errorsTopic | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.stoaGateway.otelEndpoint }}
            - name: STOA_OTEL_ENDPOINT
              value: {{ .Values.stoaGateway.otelEndpoint | quote }}
            {{- end }}
            {{- if .Values.stoaGateway.secretName }}
            - name: STOA_CONTROL_PLANE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.stoaGateway.secretName }}
                  key: STOA_CONTROL_PLANE_API_KEY
                  optional: true
            - name: STOA_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.stoaGateway.secretName }}
                  key: STOA_KEYCLOAK_CLIENT_SECRET
                  optional: true
            {{- end }}
            # Shared internal keys (CAB-1863)
            - name: GATEWAY_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: stoa-internal-keys
                  key: gateway-consumer-key
                  optional: true
            {{- with .Values.stoaGateway.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.stoaGateway.resources | nindent 12 }}
          securityContext:
            privileged: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.stoaGateway.policies .Values.stoaGateway.policies.enabled }}
            - name: policies
              mountPath: /etc/stoa/policies
              readOnly: true
            {{- end }}
            {{- if and .Values.infisical .Values.infisical.enabled }}
            - name: infisical-secrets
              mountPath: /secrets
              readOnly: true
            {{- end }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.stoaGateway.policies .Values.stoaGateway.policies.enabled }}
        - name: policies
          configMap:
            name: stoa-gateway-policies
        {{- end }}
        {{- if and .Values.infisical .Values.infisical.enabled }}
        {{- include "stoa-platform.infisical-volumes" . | nindent 8 }}
        {{- end }}
      {{- with .Values.stoaGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.stoaGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
