---
# ingress-nginx — contrôleur d'ingress du cluster labs.
#
# NodePort 30080/30443 ÉPINGLÉS : c'est le contrat d'interface avec Caddy, qui
# proxifie vers `localhost:30080` sur le nœud où il tourne. Laisser Kubernetes
# choisir un NodePort au hasard casserait la bascule à chaque redéploiement.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: stoa
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.14.5          # → controller v1.14.5, épinglé (jamais :latest)
    helm:
      values: |
        controller:
          service:
            type: NodePort
            nodePorts:
              http: 30080
              https: 30443
          ingressClassResource:
            name: nginx
            default: true
          # Une seule réplique : le cluster est reconstructible depuis Git, et
          # la disponibilité de l'ingress n'excède pas celle du nœud qui porte
          # Caddy en amont.
          replicaCount: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
          # Real client IP and rate-limit status codes.
          # proxy-real-ip-cidr must cover only the upstream proxy hop (the CNI
          # gateway of the node running Caddy). The value below is the k3s
          # default pod CIDR, a deliberate generic placeholder: the live value
          # is a narrower /32 that is not published here. It must be measured
          # again whenever the controller pod moves to another node.
          config:
            use-forwarded-headers: "true"
            proxy-real-ip-cidr: "10.42.0.0/16"
            limit-req-status-code: "429"
            limit-conn-status-code: "429"
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
