apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: ci
spec:
  # NodePort, et non ClusterIP : le registre d'images doit être joignable au
  # niveau HÔTE. containerd et `docker push` tournent hors du cluster et
  # utilisent /etc/resolv.conf, pas CoreDNS — un nom en .svc.cluster.local y est
  # irrésoluble. Chaque nœud tape son propre `localhost:30300`, kube-proxy route
  # vers le pod Gitea où qu'il soit.
  #
  # ATTENTION : kube-proxy DNATe les NodePorts AVANT ufw — ufw ne protège PAS 30300.
  # Mesuré le 21/10/2026 : Gitea joignable depuis Internet sur les 4 nœuds.
  # La protection est l'unité systemd `nodeport-guard` (table raw, SYN vers
  # 30000-32767 sur eth0 acceptés seulement depuis les IP des workers).
  #
  # Pourquoi pas une entrée /etc/hosts pointant la ClusterIP : ce serait une
  # liaison mutable posée hors de Git sur quatre nœuds. La ClusterIP change à
  # toute recréation du Service, et les /etc/hosts deviendraient périmés EN
  # SILENCE. `localhost` ne change jamais et le NodePort est versionné ici.
  type: NodePort
  # ClusterIP épinglée (F3, dette realm OCI du lot 1) : le realm du registre
  # suit ROOT_URL (gitea.ci.svc.cluster.local:3000), que les HÔTES résolvent
  # par une entrée /etc/hosts vers cette ClusterIP (rôle registry_config,
  # stoa-labs). Tant que l'adresse n'était que runtime, une recréation du
  # Service l'aurait périmée en silence — exactement l'objection du commentaire
  # ci-dessus. La déclarer ici la rend stable et versionnée. Valeur = adresse
  # actuelle du Service (immuable côté API ; apply server-side = no-op).
  clusterIP: 10.43.60.211
  selector:
    app: gitea
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
