# ServiceAccount du CronJob de redémarrage piloté (cycle trial, spéc F3 § D5,
# stoa-labs). deletecollection : c'est le verbe RBAC du DELETE par labelSelector.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wm-restarter
  namespace: wm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wm-restarter
  namespace: wm
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wm-restarter
  namespace: wm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wm-restarter
subjects:
  - kind: ServiceAccount
    name: wm-restarter
    namespace: wm
