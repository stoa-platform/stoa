# =============================================================================
# OpenBao Helm Chart — Local Dev Configuration
# =============================================================================
# OpenBao is the secrets backend STOA runs and ships (ADR-075). It serves the
# Vault HTTP API, so clients that use VAULT_ADDR / VAULT_TOKEN keep working.
# Mirrors production patterns (stoa-infra) on local K3s (Docker Desktop).
# Deploy (setup-vault-local.sh pins the chart version):
#   helm upgrade --install vault openbao/openbao --version <pinned> -n vault -f values-local.yaml
#
# Architecture:
#   K3s namespace "vault" — single-replica dev server
#   Accessible from K3s pods:   http://vault.vault.svc.cluster.local:8200
#   Accessible from Docker:     http://host.docker.internal:8200 (via port-forward)
#   Accessible via ingress:     http://vault.stoa.local (after ingress update)
# =============================================================================

global:
  enabled: true

# Keep the service names of the former HashiCorp Vault release ("vault",
# "vault-ui"): the addresses above stay valid for every local consumer.
fullnameOverride: vault

server:
  image:
    registry: docker.io
    repository: openbao/openbao
    # The chart renders registry/repository:tag and has no digest field, so the
    # tag carries the digest. `digest` repeats it for the repository's image
    # pinning guard (scripts/ci/check_image_pinning.py); the chart ignores it.
    tag: "2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f"
    digest: sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    pullPolicy: IfNotPresent

  # Dev mode — auto-initialized, auto-unsealed, in-memory storage
  dev:
    enabled: true
    devRootToken: "stoa-dev-root-token"

  standalone:
    enabled: true

  logLevel: info

  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 250m

  # Dev mode uses in-memory — no persistent storage needed
  dataStorage:
    enabled: false

  auditStorage:
    enabled: false

  # OpenBao refuses to create audit devices through the API (`bao audit
  # enable`); they are declared in the server configuration. Dev mode loads
  # this extra file, which writes the audit log to the pod log
  # (kubectl logs -n vault vault-0).
  extraArgs: "-config=/openbao/userconfig/local-audit/audit.hcl"
  volumes:
    - name: local-audit
      configMap:
        name: openbao-local-audit
  volumeMounts:
    - name: local-audit
      mountPath: /openbao/userconfig/local-audit
      readOnly: true

  service:
    type: ClusterIP
    port: 8200

# Installed with the release: the audit device declared for server.extraArgs.
extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: openbao-local-audit
    data:
      audit.hcl: |
        audit "file" "stdout" {
          description = "Local dev audit log, written to the pod log"
          options {
            file_path = "stdout"
          }
        }

# OpenBao UI — accessible via port-forward or ingress
ui:
  enabled: true
  serviceType: ClusterIP

# Agent injector — disabled initially, enable for Phase 6
injector:
  enabled: false

# CSI provider — not used locally
csi:
  enabled: false
