# Standalone gateway config. No control-plane URL, so registration,
# heartbeats, and the 60s tool-refresh loops stay off.
#
# Keycloak:
#   STOA_KEYCLOAK_URL is the issuer base. Tokens from https://auth.gostoa.dev
#   have iss=https://auth.gostoa.dev/realms/stoa. Putting the cluster DNS
#   name in STOA_KEYCLOAK_URL makes the gateway expect
#   iss=http://keycloak.stoa.svc:8080/realms/stoa and reject those tokens.
#   STOA_KEYCLOAK_INTERNAL_URL is only the fetch base. Discovery and JWKS
#   are rewritten onto it (path preserved):
#   http://keycloak.stoa.svc:8080/realms/stoa/.well-known/openid-configuration
#   STOA_JWT_ISSUER is not consulted by the validator.
#
# STOA_JWT_AUDIENCE turns audience checks on. Standalone boot refuses an
# empty value. There is no allowUnauthenticatedREST bypass. Callers need an audience
# mapper that adds aud=stoa-gateway (see README).
#
# Trusted proxies are the ingress-nginx pod addresses only. The tunnel's
# TCP peer is that pod, never a Cloudflare edge address, and the pod CIDR
# 10.42.0.0/16 also contains untrusted workloads. This manifest keeps the
# sentinel. switch.sh replaces it with the pod IPs at switch time and
# refuses to continue while the sentinel is still set. A node /24 is never
# used. Until the switch, forwarded headers are ignored.
#
# The audit spool is not opened at startup. This ConfigMap does not set
# STOA_AUDIT_SPOOL_DIR and the Deployment has no volume for it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stoa-gateway
data:
  STOA_HOST: "0.0.0.0"
  STOA_PORT: "8080"
  STOA_ENVIRONMENT: "dev"
  STOA_LOG_LEVEL: info
  STOA_LOG_FORMAT: json
  RUST_LOG: "info,stoa_gateway=info"
  STOA_GATEWAY_MODE: edge-mcp
  # Base of the OAuth discovery documents and of the 401 challenge. MCP
  # clients reach the gateway on mcp.gostoa.dev; api.gostoa.dev serves
  # /apis only, neither /.well-known nor /oauth.
  STOA_GATEWAY_EXTERNAL_URL: https://mcp.gostoa.dev
  STOA_GATEWAY_PUBLIC_URL: https://api.gostoa.dev
  STOA_KEYCLOAK_URL: https://auth.gostoa.dev
  STOA_KEYCLOAK_INTERNAL_URL: http://keycloak.stoa.svc:8080
  STOA_KEYCLOAK_REALM: stoa
  STOA_JWT_AUDIENCE: stoa-gateway
  STOA_AUTO_REGISTER: "false"
  STOA_NATIVE_TOOLS_ENABLED: "false"
  STOA_ROUTE_RELOAD_ENABLED: "false"
  STOA_KAFKA_ENABLED: "false"
  STOA_K8S_ENABLED: "false"
  STOA_BUDGET_ENFORCEMENT_ENABLED: "false"
  STOA_OTEL_ENABLED: "false"
  # 768 keeps the in-process backpressure line under the 1Gi cgroup limit.
  # The compiled default is 512, which OOM-killed the v1 gateway.
  STOA_MEMORY_LIMIT_MB: "768"
  STOA_TRUSTED_PROXIES: "REPLACE_WITH_INGRESS_NGINX_POD_IPS"
  # Public MCP endpoint (mcp.gostoa.dev, decided 2026-11-10). Behind the
  # proxy this opens /mcp, the three OAuth discovery documents and the
  # health probes. /admin, /metrics, /oauth and /v1/messages stay 404.
  # Boot is refused without STOA_KEYCLOAK_URL. See README, "Public MCP".
  STOA_PUBLIC_MCP_ENABLED: "true"
  # Sign-in for MCP clients (decided 2026-11-10). The protected resource
  # metadata names the realm as the authorization server: a client reads the
  # realm's own metadata and uses its token endpoint. The gateway's OAuth
  # proxy (/oauth/...) is not involved and stays closed behind the proxy,
  # dynamic client registration included. A client signs users in with a
  # public client the realm defines. The scopes are the ones the realm
  # defines. See README, "Sign-in for MCP clients".
  STOA_OAUTH_AUTHORIZATION_SERVERS: https://auth.gostoa.dev/realms/stoa
  STOA_OAUTH_SCOPES_SUPPORTED: "openid,profile,email,stoa:read"
