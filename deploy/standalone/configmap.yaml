# Standalone gateway config. No control-plane URL, so registration,
# heartbeats, and the 60s tool-refresh loops stay off.
#
# Keycloak:
#   STOA_KEYCLOAK_URL is the issuer base. Tokens from https://auth.gostoa.dev
#   have iss=https://auth.gostoa.dev/realms/stoa. Putting the cluster DNS
#   name in STOA_KEYCLOAK_URL makes the gateway expect
#   iss=http://keycloak.stoa.svc:8080/realms/stoa and reject those tokens.
#   STOA_KEYCLOAK_INTERNAL_URL is only the fetch base. Discovery and JWKS
#   are rewritten onto it (path preserved):
#   http://keycloak.__NAMESPACE__.svc:8080/realms/stoa/.well-known/openid-configuration
#   STOA_JWT_ISSUER is not consulted by the validator.
#
# Trusted proxies (fetched 2026-10-21 from https://www.cloudflare.com/ips-v4
# and https://www.cloudflare.com/ips-v6), plus the k3s pod CIDR. The TCP
# peer is the ingress-nginx pod, so 10.42.0.0/16 is what makes the
# Cloudflare hop in X-Forwarded-For trustworthy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stoa-gateway
  namespace: __NAMESPACE__
data:
  STOA_HOST: "0.0.0.0"
  STOA_PORT: "8080"
  STOA_ENVIRONMENT: "dev"
  STOA_LOG_LEVEL: info
  STOA_LOG_FORMAT: json
  RUST_LOG: "info,stoa_gateway=info"
  STOA_GATEWAY_MODE: edge-mcp
  STOA_GATEWAY_EXTERNAL_URL: https://__PUBLIC_HOST__
  STOA_GATEWAY_PUBLIC_URL: https://__PUBLIC_HOST__
  STOA_KEYCLOAK_URL: https://auth.gostoa.dev
  STOA_KEYCLOAK_INTERNAL_URL: http://keycloak.__NAMESPACE__.svc:8080
  STOA_KEYCLOAK_REALM: stoa
  STOA_AUTO_REGISTER: "false"
  STOA_NATIVE_TOOLS_ENABLED: "false"
  STOA_ROUTE_RELOAD_ENABLED: "false"
  STOA_KAFKA_ENABLED: "false"
  STOA_K8S_ENABLED: "false"
  STOA_BUDGET_ENFORCEMENT_ENABLED: "false"
  STOA_OTEL_ENABLED: "false"
  STOA_AUDIT_SPOOL_DIR: /var/lib/stoa-gateway/audit-spool
  STOA_TRUSTED_PROXIES: "10.42.0.0/16,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
