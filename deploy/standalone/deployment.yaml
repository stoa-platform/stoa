# Standalone stoa-gateway. Traffic stays on APISIX until
# overlays/use-stoa-gateway/switch.sh retargets Service/gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stoa-gateway
  labels:
    app: stoa-gateway
    app.kubernetes.io/name: stoa-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stoa-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: stoa-gateway
        app.kubernetes.io/name: stoa-gateway
    spec:
      # k3s node name. Confirm with `kubectl get nodes` before Friday.
      nodeSelector:
        kubernetes.io/hostname: worker-3
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stoa-gateway
          # Local import only. Build steps are in the README. Not a registry image.
          image: stoa-gateway:standalone
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: stoa-gateway
            - secretRef:
                name: stoa-gateway-admin
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
