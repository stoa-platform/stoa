# Both replicas share worker-3. minAvailable 1 still allows the
# RollingUpdate (maxUnavailable 1, maxSurge 0) to evict one pod.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stoa-gateway
  labels:
    app: stoa-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: stoa-gateway
