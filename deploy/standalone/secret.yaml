# Template only. Not part of kustomization.yaml.
# Create the Secret out of band so the token never lands in git:
#
#   kubectl -n stoa create secret generic stoa-gateway-admin \
#     --from-literal=STOA_ADMIN_API_TOKEN="$(openssl rand -hex 32)"
#
# The value below is a placeholder, not a credential.
apiVersion: v1
kind: Secret
metadata:
  name: stoa-gateway-admin
  namespace: stoa
type: Opaque
stringData:
  STOA_ADMIN_API_TOKEN: REPLACE_FROM_VAULT
