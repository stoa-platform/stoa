# In-cluster endpoint for the gateway process. This is not Service/gateway
# (the APISIX Service the public Ingress uses). Root apply must not touch
# that Service.
apiVersion: v1
kind: Service
metadata:
  name: stoa-gateway
  labels:
    app.kubernetes.io/name: stoa-gateway
spec:
  type: ClusterIP
  selector:
    app: stoa-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Admin endpoint. No Ingress references this Service.
# stoactl: http://stoa-gateway-admin.stoa.svc:8080/admin/contracts
apiVersion: v1
kind: Service
metadata:
  name: stoa-gateway-admin
  labels:
    app.kubernetes.io/name: stoa-gateway
    app.kubernetes.io/component: admin
spec:
  type: ClusterIP
  selector:
    app: stoa-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
