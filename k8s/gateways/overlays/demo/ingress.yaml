apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: demo-access
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 64k
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "2"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "5"
    nginx.ingress.kubernetes.io/enable-access-log: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [demo.invalid]
      secretName: demo-tls
  rules:
    - host: demo.invalid
      http:
        paths:
          - path: /apis/demo/
            pathType: Prefix
            backend: {service: {name: demo-gateway, port: {number: 8081}}}
          - path: /health
            pathType: Exact
            backend: {service: {name: demo-gateway, port: {number: 8081}}}
