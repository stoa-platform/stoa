worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # The controller overwrites X-Real-IP; only its pods may reach this port.
  map $http_x_real_ip $client_ip { "" $remote_addr; default $http_x_real_ip; }
  limit_req_zone $client_ip zone=per_ip:1m rate=5r/s;
  # One deployed demo credential: its shared budget covers every client IP.
  limit_req_zone $server_name zone=per_key:1m rate=10r/s;
  server {
    listen 8081;
    server_name _;
    client_max_body_size 64k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 5s;
    keepalive_timeout 5s;
    limit_req_status 429;
    limit_req zone=per_ip burst=5 nodelay;
    limit_req zone=per_key burst=10 nodelay;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    proxy_pass_request_headers off;
    proxy_set_header Host localhost;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header User-Agent $http_user_agent;
    location = /health { proxy_pass http://localhost:8080; }
    location ~ ^/apis/demo/(echo(/.*)?|meteo)$ {
      proxy_pass http://localhost:8080;
    }
    location / { return 404; }
  }
}
