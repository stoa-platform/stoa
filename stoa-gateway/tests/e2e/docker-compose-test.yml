# STOA Gateway E2E Test Environment
#
# 4 services: gateway (local build), wiremock (CP API mock), httpbin (upstream), keycloak (auth)
#
# Usage:
#   docker compose -f tests/e2e/docker-compose-test.yml up -d
#   ./tests/e2e/run-e2e.sh
#   docker compose -f tests/e2e/docker-compose-test.yml down -v

services:
  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "18080:8080"
    environment:
      STOA_HOST: "0.0.0.0"
      STOA_PORT: "8080"
      STOA_GATEWAY_MODE: "edge-mcp"
      STOA_ADMIN_API_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required; use run-e2e.sh}
      STOA_CONTROL_PLANE_URL: "http://wiremock:8080"
      STOA_GATEWAY_EXTERNAL_URL: "http://localhost:18080"
      STOA_LOG_LEVEL: "debug"
      STOA_LOG_FORMAT: "json"
      STOA_AUTO_REGISTER: "false"
      STOA_NATIVE_TOOLS_ENABLED: "true"
    depends_on:
      wiremock:
        condition: service_healthy
      httpbin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5

  wiremock:
    image: wiremock/wiremock@sha256:c3cf12f602139e3ffb4e042b246887ff6cadf3bcbb32625392d45f12e8f634d4
    pull_policy: missing
    ports:
      - "18081:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
      - ./wiremock/__files:/home/wiremock/__files:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3

  httpbin:
    image: kennethreitz/httpbin@sha256:599fe5e5073102dbb0ee3dbb65f049dab44fa9fc251f6835c9990f8fb196a72b
    pull_policy: missing
    ports:
      - "18082:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/get"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak@sha256:5a236ae4dd8ece77490115bace15a11a4d15e9cbcf58a490b95a7da2cd71d32a
    pull_policy: missing
    ports:
      - "18083:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${E2E_KEYCLOAK_ADMIN_PASSWORD:?E2E_KEYCLOAK_ADMIN_PASSWORD is required; use run-e2e.sh}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # FAPI 2.0: token exchange + DPoP + PAR (CAB-1733)
      KC_FEATURES: "token-exchange,dpop,par"
    command: start-dev
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200\\|UP'"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
