# =============================================================================
# Chaos Experiment: OpenBao Pod Delete
# =============================================================================
# STOA Platform - Phase 9.5 Production Readiness
# Tests OpenBao (Vault API, ADR-075) auto-unseal and recovery when pods are killed
# Expected: OpenBao auto-unseals (static key or KMS seal), services resume secret access
# Target: openbao/openbao chart, release "openbao" in namespace "openbao"
# =============================================================================

apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: openbao-pod-delete
  namespace: openbao
  labels:
    app.kubernetes.io/name: chaos-experiment
    app.kubernetes.io/component: openbao
    chaos-type: pod-delete
spec:
  engineState: "active"

  appinfo:
    appns: openbao
    applabel: "app.kubernetes.io/name=openbao"
    appkind: statefulset

  chaosServiceAccount: litmus-admin

  experiments:
    - name: pod-delete
      spec:
        components:
          env:
            # Delete configuration - be careful with OpenBao!
            - name: TOTAL_CHAOS_DURATION
              value: "30"
            - name: PODS_AFFECTED_PERC
              value: "33"       # Only 1 of 3 pods in HA setup
            - name: CHAOS_INTERVAL
              value: "30"       # Wait 30s between deletions
            - name: FORCE
              value: "false"    # Graceful termination

            # Sequence - serial to avoid quorum loss
            - name: SEQUENCE
              value: "serial"

            # Container runtime
            - name: CONTAINER_RUNTIME
              value: "containerd"
            - name: SOCKET_PATH
              value: "/run/containerd/containerd.sock"

        probe:
          # Check OpenBao remains accessible
          - name: "openbao-health-check"
            type: "httpProbe"
            httpProbe/inputs:
              url: "http://openbao.openbao.svc:8200/v1/sys/health"
              method:
                get:
                  criteria: "oneOf"
                  responseCode: "[200, 429, 472, 473]"  # Various healthy states
            mode: "Continuous"
            runProperties:
              probeTimeout: 10
              interval: 5
              retry: 5
              probePollingInterval: 3

          # Verify auto-unseal completes
          - name: "openbao-unsealed-check"
            type: "httpProbe"
            httpProbe/inputs:
              url: "http://openbao.openbao.svc:8200/v1/sys/seal-status"
              method:
                get:
                  criteria: "=="
                  responseCode: "200"
            mode: "EOT"  # End of Test
            runProperties:
              probeTimeout: 60
              interval: 10
              retry: 6
              probePollingInterval: 5

          # Verify secrets are still accessible
          - name: "openbao-unsealed-cli"
            type: "cmdProbe"
            cmdProbe/inputs:
              command: |
                # bao status exits 0 only when the server is unsealed
                bao status -address=http://openbao.openbao.svc:8200 >/dev/null && echo true
              source:
                image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
              comparator:
                type: "string"
                criteria: "contains"
                value: "true"
            mode: "EOT"
            runProperties:
              probeTimeout: 30
              interval: 10
              retry: 3

---
# OpenBao network partition test (advanced)
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: openbao-network-partition
  namespace: openbao
  labels:
    app.kubernetes.io/name: chaos-experiment
    app.kubernetes.io/component: openbao
    chaos-type: network-partition
spec:
  engineState: "active"

  appinfo:
    appns: openbao
    applabel: "app.kubernetes.io/name=openbao"
    appkind: statefulset

  chaosServiceAccount: litmus-admin

  experiments:
    - name: pod-network-partition
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "30"
            - name: PODS_AFFECTED_PERC
              value: "33"       # Partition 1 pod
            - name: NETWORK_INTERFACE
              value: "eth0"
            - name: CONTAINER_RUNTIME
              value: "containerd"
            - name: SOCKET_PATH
              value: "/run/containerd/containerd.sock"

        probe:
          - name: "openbao-cluster-healthy"
            type: "httpProbe"
            httpProbe/inputs:
              url: "http://openbao.openbao.svc:8200/v1/sys/health"
              method:
                get:
                  criteria: "oneOf"
                  responseCode: "[200, 429, 472, 473]"
            mode: "Continuous"
            runProperties:
              probeTimeout: 10
              interval: 5
              retry: 5
              probePollingInterval: 3

          # Check the raft quorum holds: a leader is still known
          - name: "openbao-raft-quorum"
            type: "cmdProbe"
            cmdProbe/inputs:
              command: |
                # No token: bao status reads sys/seal-status, then sys/leader (both unauthenticated).
                # leader_address comes from sys/leader and is printed only while a leader is known
                # (quorum of 2 with one pod partitioned). raft list-peers needs a BAO_TOKEN in the
                # probe pod and always failed without it.
                bao status -address=http://openbao.openbao.svc:8200 -format=json \
                  | grep -Eq '"leader_address": *"https?://' && echo true
              source:
                image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
              comparator:
                type: "string"
                criteria: "contains"
                value: "true"
            mode: "Continuous"
            runProperties:
              probeTimeout: 15
              interval: 10
              retry: 3
